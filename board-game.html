// Short, original game effects synthesized locally; no audio downloads or controls.
let gameAudio=null,gameAudioBus=null,gameAudioNoise=null;
function unlockGameAudio(){
 try{
   const AudioEngine=window.AudioContext||window.webkitAudioContext;
   if(!AudioEngine)return null;
   if(!gameAudio||gameAudio.state==='closed'){
     gameAudio=new AudioEngine();
     const volume=gameAudio.createGain();volume.gain.value=.32;
     const limiter=gameAudio.createDynamicsCompressor();
     limiter.threshold.value=-16;limiter.knee.value=18;limiter.ratio.value=5;
     volume.connect(limiter);limiter.connect(gameAudio.destination);
     gameAudioBus=volume;
     gameAudioNoise=gameAudio.createBuffer(1,gameAudio.sampleRate,gameAudio.sampleRate);
     const data=gameAudioNoise.getChannelData(0);
     for(let i=0;i<data.length;i++)data[i]=Math.random()*2-1;
   }
   if(gameAudio.state!=='running'){
     const resumed=gameAudio.resume();
     if(resumed&&resumed.catch)resumed.catch(function(){});
   }
   return gameAudio;
 }catch(audioError){return null}
}
document.addEventListener('pointerdown',unlockGameAudio,{capture:true,passive:true});
document.addEventListener('touchend',unlockGameAudio,{capture:true,passive:true});
document.addEventListener('click',unlockGameAudio,{capture:true,passive:true});
document.addEventListener('keydown',function(e){if(e.key==='Enter'||e.key===' ')unlockGameAudio()},{capture:true});
function playGameSound(effect){
 try{
   if(!gameAudio||gameAudio.state!=='running'||document.hidden)return;
   const audio=gameAudio,bus=gameAudioBus,now=audio.currentTime+.012;
   function tone(frequency,delay,duration,level,type,endFrequency){
     const oscillator=audio.createOscillator(),gain=audio.createGain(),start=now+delay;
     oscillator.type=type||'sine';
     oscillator.frequency.setValueAtTime(frequency,start);
     if(endFrequency)oscillator.frequency.exponentialRampToValueAtTime(endFrequency,start+duration);
     gain.gain.setValueAtTime(0,start);
     gain.gain.linearRampToValueAtTime(level,start+.008);
     gain.gain.exponentialRampToValueAtTime(.0001,start+duration);
     oscillator.connect(gain);gain.connect(bus);
     oscillator.onended=function(){oscillator.disconnect();gain.disconnect()};
     oscillator.start(start);oscillator.stop(start+duration+.02);
   }
   function noise(delay,duration,level,frequency,kind){
     const source=audio.createBufferSource(),filter=audio.createBiquadFilter(),gain=audio.createGain(),start=now+delay;
     source.buffer=gameAudioNoise;source.loop=true;
     filter.type=kind||'lowpass';filter.frequency.value=frequency||1400;
     gain.gain.setValueAtTime(0,start);
     gain.gain.linearRampToValueAtTime(level,start+.005);
     gain.gain.exponentialRampToValueAtTime(.0001,start+duration);
     source.connect(filter);filter.connect(gain);gain.connect(bus);
     source.onended=function(){source.disconnect();filter.disconnect();gain.disconnect()};
     source.start(start);source.stop(start+duration+.02);
   }
   function melody(notes,spacing,duration,level,type,delay){
     notes.forEach(function(note,i){tone(note,(delay||0)+i*spacing,duration,level,type)});
   }
   switch(effect){
     case 'dice':
       for(let i=0;i<10;i++){noise(i*.09,.065,.22,1500+i%3*400);tone(240+i%4*45,i*.09,.06,.08,'triangle')}
       noise(1.02,.14,.36,800);tone(135,1.02,.15,.14,'triangle',75);break;
     case 'move':
       tone(520,0,.085,.12,'triangle',360);noise(0,.055,.07,900);break;
     case 'correct':
       melody([523.25,659.25,783.99,1046.5],.09,.24,.18,'sine');break;
     case 'wrong':
       tone(240,0,.25,.17,'triangle',145);tone(180,.15,.3,.13,'triangle',95);break;
     case 'pixie':
       melody([1046.5,1318.51,1567.98,2093,1567.98,2637.02],.095,.35,.12,'sine');break;
     case 'snack':
       melody([392,523.25,659.25,523.25],.13,.22,.16,'triangle');tone(1046.5,.48,.32,.1);break;
     case 'card':
       for(let i=0;i<5;i++)noise(i*.085,.07,.2,2600,'highpass');
       tone(660,.42,.14,.12,'triangle',880);break;
     case 'pin':
       melody([783.99,1046.5,1318.51,1567.98],.13,.38,.16);
       tone(2093,.55,.5,.09);break;
     case 'autograph':
       for(let i=0;i<7;i++)noise(i*.055,.045,.07,3300,'bandpass');
       melody([659.25,783.99,1046.5,1318.51],.1,.3,.16,'sine',.42);break;
     case 'security':
       noise(0,.045,.2,1100);tone(95,0,.08,.16,'triangle');
       for(let i=0;i<3;i++){tone(620,.18+i*.42,.2,.1,'sine',900);tone(900,.38+i*.42,.2,.1,'sine',620)}
       break;
     case 'doubles':
       noise(0,.5,.55,950);tone(100,0,.4,.3,'triangle',40);
       melody([523.25,783.99,1046.5],.11,.28,.15,'triangle',.15);break;
     case 'fireworks':
       for(let i=0;i<4;i++){
         const delay=i*.62;
         tone(450,delay,.22,.08,'sine',1700);
         noise(delay+.24,.55,.28,1500);
         tone(90,delay+.24,.32,.15,'sine',35);
         for(let j=0;j<4;j++)noise(delay+.35+j*.06,.045,.09,4000,'highpass');
       }
       break;
     case 'victory':
       melody([523.25,659.25,783.99,1046.5,783.99,1046.5,1318.51],.21,.45,.19,'triangle',.2);
       [523.25,659.25,783.99,1046.5].forEach(function(note){tone(note,1.85,1.2,.1,'triangle')});break;
   }
 }catch(audioError){
   // Sound must never interrupt a turn, trade, reward, or animation.
 }
}

let snackDeck=[];
let lastSnackName='';
function commonsSnackImage(file,width){
 return 'https://commons.wikimedia.org/wiki/Special:Redirect/file/'+encodeURIComponent(file)+(width?'?width='+width:'');
}
function commonsSnackSource(file){
 return 'https://commons.wikimedia.org/wiki/File:'+encodeURIComponent(file).replace(/%20/g,'_');
}
function snackNameMask(snack){
 if(!snack.mask)return '';
 return '<div class="snack-name-mask" id="snackNameMask" aria-hidden="true"></div>';
}
function positionSnackNameMask(snack,photo){
 if(!snack.mask||!photo||!photo.naturalWidth||!photo.naturalHeight)return;
 const mask=document.getElementById('snackNameMask');
 const frame=document.getElementById('snackPicture');
 if(!mask||!frame)return;
 const fw=frame.clientWidth,fh=frame.clientHeight;
 const scale=Math.max(fw/photo.naturalWidth,fh/photo.naturalHeight);
 const rw=photo.naturalWidth*scale,rh=photo.naturalHeight*scale;
 const ox=(fw-rw)/2,oy=(fh-rh)/2;
 const m=snack.mask;
 mask.style.left=(ox+(m.left/100)*rw)+'px';
 mask.style.top=(oy+(m.top/100)*rh)+'px';
 mask.style.width=((m.width/100)*rw)+'px';
 mask.style.height=((m.height/100)*rh)+'px';
}
function refillSnackDeck(){
 snackDeck=shuffle(SNACK_BREAKS.map(function(s,i){return i}));
}
function pickSnackBreak(){
 if(!snackDeck.length)refillSnackDeck();
 if(lastSnackName&&snackDeck.length>1&&SNACK_BREAKS[snackDeck[snackDeck.length-1]].name===lastSnackName){
   const alt=snackDeck.findIndex(function(i){return SNACK_BREAKS[i].name!==lastSnackName});
   if(alt>=0){
     const last=snackDeck.length-1;
     const tmp=snackDeck[alt];snackDeck[alt]=snackDeck[last];snackDeck[last]=tmp;
   }
 }
 const snack=SNACK_BREAKS[snackDeck.pop()];
 lastSnackName=snack.name;
 return snack;
}
function snackChoices(snack){
 const names=[];
 shuffle(SNACK_BREAKS.slice()).forEach(function(s){
   if(s.name!==snack.name&&names.indexOf(s.name)<0&&names.length<3)names.push(s.name);
 });
 return shuffle([snack.name].concat(names));
}
function askSnackBreak(spaceIndex){
 const snack=pickSnackBreak();
 modalRoot.innerHTML='<div class="modal-backdrop"><div class="modal snack-modal"><div class="badge">🍿 SNACK BREAK • CORRECT +$50</div><div class="snack-kicker">Mystery Disney Food • 30 Photo Deck</div><div class="snack-picture" id="snackPicture"><img id="snackPhoto" data-snack-file="'+esc(snack.file)+'" alt="Mystery Disney food photo">'+snackNameMask(snack)+'</div><div class="snack-credit">Photo: <a href="'+commonsSnackSource(snack.file)+'" target="_blank" rel="noopener">'+esc(snack.credit)+'</a> • <a href="'+snack.licenseUrl+'" target="_blank" rel="noopener">'+esc(snack.license)+'</a></div><div class="snack-question">What food is this?</div><div class="snack-reward">Correct answer earns $50 Disney Dollars</div><div class="answers" id="snackAnswers"></div><div class="result" id="snackResult"></div><div class="actions" id="snackActions"></div></div></div>';
 const photo=document.getElementById('snackPhoto');
 let triedFallback=false;
 photo.onload=function(){positionSnackNameMask(snack,photo)};
 photo.onerror=function(){
   if(!triedFallback){
     triedFallback=true;
     photo.src=commonsSnackImage(snack.file,0);
     return;
   }
   document.getElementById('snackPicture').innerHTML='<div class="snack-load-error">This photo could not load in this browser.</div>';
 };
 photo.src=commonsSnackImage(snack.file,960);
 const answers=document.getElementById('snackAnswers');
 snackChoices(snack).forEach(function(choice){
   const b=document.createElement('button');
   b.className='answer';
   b.textContent=choice;
   b.addEventListener('click',function(){gradeSnackBreak(choice,snack,b)});
   answers.appendChild(b);
 });
}
function gradeSnackBreak(choice,snack,btn){
 const buttons=Array.from(document.querySelectorAll('#snackAnswers .answer'));
 const ok=choice===snack.name;
 playGameSound(ok?'correct':'wrong');
 buttons.forEach(function(b){b.disabled=true;if(b.textContent===snack.name)b.classList.add('correct')});
 if(!ok)btn.classList.add('wrong');
 const p=players[currentPlayer];
 const result=document.getElementById('snackResult');
 const actions=document.getElementById('snackActions');
 if(ok){
   p.cash+=50;
   renderScores();
   result.innerHTML='<span class="good">Correct!</span> That is '+esc(snack.name)+'. You earned <strong>$50</strong>!';
 }else{
   result.innerHTML='<span class="bad">Not quite.</span> That was <strong>'+esc(snack.name)+'</strong>.';
 }
 actions.innerHTML='<button class="primary" id="snackContinue">Continue</button>';
 document.getElementById('snackContinue').addEventListener('click',function(){
   closeModal();
   const msg=ok?p.name+' identified '+snack.name+' and earned $50.':p.name+' missed the Snack Break. The answer was '+snack.name+'.';
   if(ok)finishCorrectAnswer(msg);else finishTurn(msg);
 });
}

function esc(s){return String(s).replace(/[&<>"']/g,function(m){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]})}
function shuffle(a){const b=a.slice();for(let i=b.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));const t=b[i];b[i]=b[j];b[j]=t}return b}
function showSetup(){
 app.innerHTML='<section class="panel"><div class="badge" id="countBadge">1 player</div><h1>🎲 WDWQuest Board Game</h1><p class="muted">A first playable mix of trivia, attraction ownership, rent, Disney Dollars, category badges, and a final castle challenge.</p><h3>Who is playing?</h3><p class="muted">Play solo or add up to 8 players. The other WDWQuest games stay at 1–4.</p><div class="setup-grid" id="setupGrid"></div><div class="actions"><button class="primary" id="startGame">Continue to Token Selection</button><button class="secondary" id="addPlayer">Add Player</button></div><div class="muted" id="setupMsg" style="margin-top:10px">Each player starts with $1,000 Disney Dollars.</div></section>';
 const grid=document.getElementById('setupGrid');
 const add=document.getElementById('addPlayer');
 const count=document.getElementById('countBadge');
 function draw(){
   grid.innerHTML=setupPlayers.map(function(p,i){return '<div class="player-row"><label>Player '+(i+1)+'</label><input data-p="'+i+'" '+(p.name?'value="'+esc(p.name)+'" ':'')+'placeholder="Player '+(i+1)+'" maxlength="24" autocomplete="new-password" autocapitalize="words">'+(setupPlayers.length>1?'<button class="secondary" type="button" data-remove="'+i+'">Remove</button>':'')+'</div>'}).join('');
   count.textContent=setupPlayers.length+(setupPlayers.length===1?' player':' players');
   add.disabled=setupPlayers.length>=8;
   grid.querySelectorAll('[data-p]').forEach(function(input){
     const i=Number(input.dataset.p),def='Player '+(i+1);
     input.addEventListener('focus',function(){if(input.value.trim()===def)input.select()});
     input.addEventListener('beforeinput',function(){if(input.value.trim()===def)input.value=''});
     input.addEventListener('input',function(){setupPlayers[i].name=input.value.slice(0,24)});
   });
   grid.querySelectorAll('[data-remove]').forEach(function(btn){btn.addEventListener('click',function(){if(setupPlayers.length<=1)return;setupPlayers.splice(Number(btn.dataset.remove),1);draw()})});
 }
 add.addEventListener('click',function(){if(setupPlayers.length>=8)return;setupPlayers.push({name:''});draw()});
 document.getElementById('startGame').addEventListener('click',function(){
   const cleaned=setupPlayers.map(function(p,i){return (p.name||'').trim()||('Player '+(i+1))});
   const keys=cleaned.map(function(x){return x.toLowerCase()});
   if(new Set(keys).size!==keys.length){document.getElementById('setupMsg').textContent='Give each player a different name.';document.getElementById('setupMsg').className='bad';return}
   players=cleaned.map(function(name){return {name:name,cash:1000,pos:0,badges:[],props:[],autographs:[],token:null}});
   showTokenSetup(0);
 });
 draw();
}
function tokenInfo(id){
 return TOKEN_OPTIONS.find(function(t){return t.id===id})||{id:'unknown',icon:'🎟️',name:'Token',x:0,y:0};
}
function tokenArt(tok,className){
 tok=tok||tokenInfo('unknown');
 return '<span class="token-art '+(className||'')+'" aria-hidden="true" style="--token-x:'+tok.x+'%;--token-y:'+tok.y+'%;"></span>';
}
function showTokenSetup(activeIndex){
 if(!players.length){showSetup();return}
 activeIndex=Math.max(0,Math.min(players.length-1,Number(activeIndex)||0));
 app.innerHTML='<section class="panel"><div class="badge">REQUIRED STEP 2 OF 3 • 12 TOKENS</div><h1>Choose Your Playing Pieces</h1><p class="muted">Each player gets one unique Disney World-themed piece. The token you choose here is the piece that will move around the board during your turns.</p><div class="token-players" id="tokenPlayers"></div><h2 id="tokenHeading"></h2><div class="token-choice-grid" id="tokenChoices"></div><div class="actions"><button class="primary" id="tokenStart">Continue to Starting Pins</button><button class="secondary" id="tokenBack">Back to Players</button></div><div class="muted" id="tokenMsg" style="margin-top:10px"></div></section>';
 const playerBar=document.getElementById('tokenPlayers');
 const choices=document.getElementById('tokenChoices');
 const heading=document.getElementById('tokenHeading');
 const start=document.getElementById('tokenStart');
 const msg=document.getElementById('tokenMsg');
 function draw(){
   const active=players[activeIndex];
   const selected=active.token?tokenInfo(active.token):null;
   heading.innerHTML=selected?esc(active.name)+', you picked '+tokenArt(selected,'chosen-token')+esc(selected.name):esc(active.name)+', choose your token';
   playerBar.innerHTML=players.map(function(pl,i){
     const tok=pl.token?tokenInfo(pl.token):null;
     return '<button type="button" class="token-player-btn '+(i===activeIndex?'active ':'')+(tok?'done':'')+'" data-token-player="'+i+'">'+(tok?tokenArt(tok,'token-player-art'):'')+esc(pl.name)+'</button>';
   }).join('');
   choices.innerHTML=TOKEN_OPTIONS.map(function(tok){
     const ownerIndex=players.findIndex(function(pl){return pl.token===tok.id});
     const mine=ownerIndex===activeIndex;
     const claimed=ownerIndex>=0&&!mine;
     const ownerText=claimed?'<small>Picked by '+esc(players[ownerIndex].name)+'</small>':'';
     return '<button type="button" class="token-choice '+(mine?'selected ':'')+(claimed?'claimed':'')+'" data-token-id="'+tok.id+'" '+(claimed?'disabled':'')+'>'+tokenArt(tok,'')+'<span class="token-label">'+esc(tok.name)+'</span>'+ownerText+'</button>';
   }).join('');
   const complete=players.every(function(pl){return !!pl.token});
   start.disabled=!complete;
   const missing=players.filter(function(pl){return !pl.token}).length;
   msg.textContent=complete?'Everyone has a token. Choose your starting pins next!':missing+' player'+(missing===1?' still needs':'s still need')+' a token.';
   playerBar.querySelectorAll('[data-token-player]').forEach(function(btn){
     btn.addEventListener('click',function(){activeIndex=Number(btn.dataset.tokenPlayer);draw()});
   });
   choices.querySelectorAll('[data-token-id]').forEach(function(btn){
     btn.addEventListener('click',function(){
       players[activeIndex].token=btn.dataset.tokenId;
       const next=players.findIndex(function(pl,i){return i>activeIndex&&!pl.token});
       if(next>=0)activeIndex=next;
       else{
         const firstMissing=players.findIndex(function(pl){return !pl.token});
         if(firstMissing>=0)activeIndex=firstMissing;
       }
       draw();
     });
   });
 }
 start.addEventListener('click',function(){
   if(!players.every(function(pl){return !!pl.token}))return;
   showStartingPinSetup(0);
 });
 document.getElementById('tokenBack').addEventListener('click',function(){
   setupPlayers=players.map(function(pl){return {name:pl.name}});
   showSetup();
 });
 draw();
}

function startingPinsComplete(){
 const ids=players.map(function(p){return p.startingPin});
 return !!players.length&&ids.every(function(id){return !!pinInfo(id)})&&new Set(ids).size===players.length;
}
function showStartingPinSetup(activeIndex){
 if(!players.length){showSetup();return}
 const missingToken=players.findIndex(function(p){return !p.token});

     const pin=pinInfo(p.startingPin);

   }).join('');
   choices.innerHTML=PIN_DESIGNS.map(function(pin){
     const ownerIndex=players.findIndex(function(p){return p.startingPin===pin.id});

     return '<button type="button" class="pin-card starting-pin-choice '+(mine?'selected ':'')+(claimed?'claimed':'')+'" style="--pin-color:'+pin.color+'" data-starting-pin-id="'+pin.id+'" aria-pressed="'+mine+'" '+(claimed?'disabled':'')+'><span class="pin-art" aria-hidden="true">'+pin.icon+'</span><strong>'+esc(pin.name)+'</strong><small>'+esc(pin.park)+'</small><small>'+(claimed?'Picked by '+esc(players[ownerIndex].name):mine?'Your starting pin':'Available')+'</small></button>';
   }).join('');
   const complete=startingPinsComplete(),missing=players.filter(function(p){return !pinInfo(p.startingPin)}).length;
   start.disabled=!complete;
   msg.textContent=complete?'Everyone has a unique starting pin. Ready to play!':missing+' player'+(missing===1?' still needs':'s still need')+' a starting pin.';

     button.addEventListener('click',function(){activeIndex=Number(button.dataset.startingPinPlayer);draw()});
   });
   choices.querySelectorAll('[data-starting-pin-id]').forEach(function(button){
     button.addEventListener('click',function(){
       const id=button.dataset.startingPinId;
       if(!pinInfo(id)||players.some(function(p,i){return i!==activeIndex&&p.startingPin===id}))return;
       players[activeIndex].startingPin=id;
       const next=players.findIndex(function(p,i){return i>activeIndex&&!pinInfo(p.startingPin)});
       if(next>=0)activeIndex=next;
       else{
         const missing=players.findIndex(function(p){return !pinInfo(p.startingPin)});
         if(missing>=0)activeIndex=missing;
       }
       draw();
     });
   });
 }

 app.innerHTML='<div class="game-layout"><section class="panel turn-panel"><div class="turn" id="turnText"></div><button class="dice" id="dice" type="button" aria-label="Roll dice"><span class="dice-pair"><span class="die-cube" id="dieCube" aria-hidden="true"><span class="die-face front">⚀</span><span class="die-face right">⚁</span><span class="die-face top">⚂</span><span class="die-face bottom">⚃</span><span class="die-face left">⚄</span><span class="die-face back">⚅</span></span><span class="die-cube" id="dieCube2" aria-hidden="true"><span class="die-face front">⚀</span><span class="die-face right">⚁</span><span class="die-face top">⚂</span><span class="die-face bottom">⚃</span><span class="die-face left">⚄</span><span class="die-face back">⚅</span></span></span></button><div class="status" id="status">Roll the dice to begin.</div><div class="actions"><button class="primary" id="rollBtn">Roll Dice</button><button class="secondary" id="rulesBtn">Quick Rules</button></div></section><div class="board-wrap"><div class="board" id="board"><div class="center"><div class="park-side-label park-label-top">Magic Kingdom</div><div class="park-side-label park-label-right">EPCOT</div><div class="park-side-label park-label-bottom">Hollywood Studios</div><div class="park-side-label park-label-left">Animal Kingdom</div><h1>WDWQuest</h1><section class="current-player-center" id="currentPlayerCenter" aria-label="Current player stats" aria-live="polite"></section><div class="center-games"><button class="pin-kiosk" id="pinKiosk" type="button"><span aria-hidden="true">📌</span><strong>Pin Traders</strong><small>Land on a Pin Traders space to trade</small></button><button class="castle-finale-space" id="castleFinaleBtn" type="button"><span class="castle-icon">🏰</span><strong>Cinderella Castle Finale</strong><span class="finale-status" id="castleFinaleStatus">6 badges + every property and pin in the same park</span></button><button class="magic-pile" id="magicPile" type="button" aria-labe function boardRect(i){
 const board=document.getElementById('board');
 const previousOuter=Math.min(1557,(window.innerWidth-(window.innerWidth<=760?20:184))*.9);
 const corner=(7*1.10*1.22*1.25)*(previousOuter-6)/board.clientWidth;
 const along=(100-2*corner)/19,depth=corner;
 const side=Math.floor(i/20),step=i%20;
 const cornerSize=corner;
 if(step===0){
   return {top:side<2?0:100-cornerSize,left:side===0||side===3?0:100-cornerSize,width:cornerSize,height:cornerSize,side:['top','right','bottom','left'][side]};
 }
 const offset=corner+(step-1)*along;
 if(side===0)return {top:0,left:offset,width:along,height:depth,side:'top'};
 if(side===1)return {top:offset,left:100-depth,width:depth,height:along,side:'right'};
 if(side===2)return {top:100-depth,left:100-offset-along,width:along,height:depth,side:'bottom'};
 return {top:100-offset-along,left:0,width:depth,height:along,side:'left'};
}

const finaleFireworksCanvas=document.getElementById('finaleFireworks');

function resizeFinaleFireworks(){
 const dpr=Math.min(window.devicePixelRatio||1,2);
 finaleFireworksCanvas.width=Math.round(window.innerWidth*dpr);
 finaleFireworksCanvas.height=Math.round(window.innerHeight*dpr);
 finaleFireworksCanvas.style.width=window.innerWidth+'px';

function burstFinaleFirework(x,y,count){
 const colors=['#ffd166','#ff5d8f','#7bdff2','#b8f2e6','#cdb4db','#ffffff','#ffadad','#f4d35e'];
 const total=count||54;
 for(let i=0;i<total;i++){
   const angle=((Math.PI*2)/total)*i+(Math.random()*.18);
   const speed=2.6+Math.random()*5.2;
   finaleFireworksParticles.push({
     x:x,y:y,
     vx:Math.cos(angle)*speed,
     vy:Math.sin(angle)*speed,
     life:58+Math.random()*28,
     maxLife:86,
     size:1.8+Math.random()*2.6,
     color:colors[Math.floor(Math.random()*colors.length)]
   });
 }
}
function launchFinaleFirework(){
 const w=window.innerWidth,h=window.innerHeight;
 burstFinaleFirework(
   w*(.1+Math.random()*.8),
   h*(.10+Math.random()*.48),
   44+Math.floor(Math.random()*24)
 );
}
function drawFinaleFireworks(){
 finaleFireworksCtx.clearRect(0,0,window.innerWidth,window.innerHeight);
 for(let i=finaleFireworksParticles.length-1;i>=0;i--){
   const p=finaleFireworksParticles[i];
   p.x+=p.vx;p.y+=p.vy;p.vy+=.038;p.vx*=.994;p.life-=1;
   const alpha=Math.max(0,p.life/p.maxLife);
   finaleFireworksCtx.globalAlpha=alpha;
   finaleFireworksCtx.shadowBlur=10;
   finaleFireworksCtx.shadowColor=p.color;
   finaleFireworksCtx.fillStyle=p.color;
   finaleFireworksCtx.beginPath();
   finaleFireworksCtx.arc(p.x,p.y,p.size,0,Math.PI*2);
   finaleFireworksCtx.fill();
   if(p.life<=0)finaleFireworksParticles.splice(i,1);
 }
 finaleFireworksCtx.globalAlpha=1;
 finaleFireworksCtx.shadowBlur=0;
 if(finaleFireworksRunning||finaleFireworksParticles.length){
   finaleFireworksFrame=requestAnimationFrame(drawFinaleFireworks);
 }else{
   finaleFireworksCtx.clearRect(0,0,window.innerWidth,window.innerHeight);
 }
}
function stopFinaleFireworks(){
 finaleFireworksRunning=false;
 clearInterval(finaleFireworksBurstTimer);
 clearTimeout(finaleFireworksStopTimer);
 cancelAnimationFrame(finaleFireworksFrame);
 finaleFireworksParticles=[];
 finaleFireworksCtx.clearRect(0,0,window.innerWidth,window.innerHeight);
 finaleFireworksCanvas.classList.remove('active');
}
function startFinaleFireworks(duration){

}

function finaleProgress(playerIndex){
 const p=players[playerIndex];
 if(!p)return {missingBadges:BADGES.slice(),parks:[],qualifyingPark:null,bestPark:null,ready:false};
 const missingBadges=BADGES.filter(function(badge){return !(p.badges||[]).includes(badge)});
 const parks=[...new Set(PIN_DESIGNS.map(function(pin){return pin.park}))].map(function(park){
   const propertyIndices=[];
   SPACES.forEach(function(space,i){if(space.type==='property'&&space.park===park)propertyIndices.push(i)});
   const pins=PIN_DESIGNS.filter(function(pin){return pin.park===park});
   const propertiesOwned=propertyIndices.filter(function(i){return owners[i]===playerIndex}).length;
   const pinsOwned=pins.filter(function(pin){return (p.pins||[]).includes(pin.id)}).length;
   return {park:park,propertiesOwned:propertiesOwned,propertiesTotal:propertyIndices.length,pinsOwned:pinsOwned,pinsTotal:pins.length,
     complete:propertyIndices.length>0&&pins.length>0&&propertiesOwned===propertyIndices.length&&pinsOwned===pins.length};
 });
 const qualifyingPark=parks.find(function(park){return park.complete})||null;
 const bestPark=parks.slice().sort(function(a,b){
   return (b.propertiesOwned/b.propertiesTotal+b.pinsOwned/b.pinsTotal)-(a.propertiesOwned/a.propertiesTotal+a.pinsOwned/a.pinsTotal);
 })[0]||null;
 return {missingBadges:missingBadges,parks:parks,qualifyingPark:qualifyingPark,bestPark:bestPark,ready:missingBadges.length===0&&!!qualifyingPark&&!(p.finaleLapRemaining>0)};
}

function applyMagicInstantEffect(card,playerIndex){
 const p=players[playerIndex];
 const others=players.filter(function(other,i){return i!==playerIndex&&!other.eliminated});
 let amount=0;
 if(card.effect==='cash'){p.cash+=card.amount;return p.name+(card.amount>=0?' collected $':' paid $')+Math.abs(card.amount)+'.'}
 if(card.effect==='rentPass'){p.rentPasses=(p.rentPasses||0)+1;return p.name+' received a Magic Rent Pass for the next rent payment.'}
 if(card.effect==='propertyBonus'){amount=Math.max(20,Math.min(100,p.props.length*20));p.cash+=amount;return p.name+' collected a $'+amount+' Park Partner Bonus.'}
 if(card.effect==='maintenance'){amount=Math.max(10,Math.min(75,p.props.length*10));p.cash-=amount;return p.name+' paid $'+amount+' in maintenance.'}
 if(card.effect==='collectPlayers'){
   if(!others.length){p.cash+=50;return p.name+' collected $50 from the bank.'}
   others.forEach(function(other){other.cash-=25;p.cash+=25});
   return p.name+' collected $25 from each other active player ($'+(others.length*25)+' total).';
 }
 if(card.effect==='payPlayers'){
   if(!others.length){p.cash-=25;return p.name+' paid $25 to the bank.'}
   others.forEach(function(other){other.cash+=25;p.cash-=25});
   return p.name+' paid $25 to each other active player ($'+(others.length*25)+' total).';
 }
 if(card.effect==='richestGift'){
   let richest=-1;
   players.forEach(function(other,i){if(i!==playerIndex&&!other.eliminated&&(richest<0||other.cash>players[richest].cash))richest=i});
   p.cash+=50;
   if(richest<0)return p.name+' received $50 from the bank.';
   players[richest].cash-=50;
   return players[richest].name+' gave '+p.name+' $50.';
 }
 throw new Error('Unknown Magic & Mischief effect: '+card.effect);
}
function magicTravelDistance(card,from){

   if((card.target==='transport'&&s.type==='transport')||(card.target==='show'&&s.show)||(card.target==='snack'&&s.name==='Snack Break'))return steps;
 }
 return 0;
}

 if(card.effect==='security'){
   playGameSound('security');
   await animateSecurityEscort(currentPlayer);
   p.inSecurity=true;p.skipTurns=1;notePawnArrival(p);
   movingPlayer=currentPlayer;renderAll();
   const spot=document.getElementById('securitySpot');
   if(spot)spot.scrollIntoView({behavior:reducedMotion()?'auto':'smooth',block:'center',inline:'center'});
   setStatus(esc(p.name)+' goes to <strong>Park Security</strong> and will miss the next turn.');
   if(!reducedMotion())await wait(900);
   movingPlayer=-1;
   finishTurn(p.name+' drew '+card.title+'. Sent to Security: miss the next turn. No lap bonus.');
   return;
 }
 if(card.effect==='move'||card.effect==='destination'){
   const steps=magicTravelDistance(card,p.pos);
   addLog(p.name+' drew '+card.title+'. '+card.text);
   if(!steps){finishTurn(p.name+' stayed in place.');return}
   await movePlayerSpaces(steps,steps<0?'moves backward':'travels with Magic & Mischief');
   renderScores();
   setStatus(esc(p.name)+' reached <strong>'+esc(SPACES[p.pos].name)+'</strong>.');
   await pauseAfterLanding(p.pos);
   await resolveSpace(p.pos,false);
   return;
 }
 const message=applyMagicInstantEffect(card,currentPlayer);
 finishTurn(p.name+' drew '+card.title+'. '+message);
}

function pickQuestion(badge,finalMode){
 const categories=Array.from(new Set(QUESTION_BANK.map(function(q){return q.badge})));
 categories.forEach(function(category){if(!questionDecks[category])refillQuestionDeck(category)});
 if(!categories.includes(badge)){
   let available=categories.filter(function(category){return questionDecks[category].length>0});
   if(!available.length){categories.forEach(refillQuestionDeck);available=categories.slice()}
   if(finalMode){
     const withExperts=available.filter(function(category){return questionDecks[category].some(function(i){return QUESTION_BANK[i].diff==='Expert'})});
     if(withExperts.length)available=withExperts;
   }
   badge=available[Math.floor(Math.random()*available.length)];
 }
 const deck=questionDecks[badge].length?questionDecks[badge]:refillQuestionDeck(badge);
 let position=deck.length-1;
 if(finalMode){
   const expert=deck.findIndex(function(i){return QUESTION_BANK[i].diff==='Expert'&&i!==lastQuestionsByBadge[badge]});
   if(expert>=0)position=expert;
 }
 const index=deck.splice(position,1)[0];
 lastQuestion=index;lastQuestionsByBadge[badge]=index;
 return QUESTION_BANK[index];
}

function applySpecialSpace(spaceIndex,correct){

   p.cash+=amount;
   renderScores();

 }

function gradeQuestion(choice,q,ctx,btn){
 if(ctx.mode==='final'&&!finaleProgress(currentPlayer).ready){closeModal();finishTurn(players[currentPlayer].name+' no longer meets the Castle Finale requirements.');return}
 const buttons=Array.from(document.querySelectorAll('#qAnswers .answer'));buttons.forEach(function(b){b.disabled=true;if(b.textContent===q.a)b.classList.add('correct')});

     }

   });

 }
 if(ctx.mode==='final'){

   return;
 }
 let badgeMsg='';
 if(ctx.mode==='badge'||ctx.mode==='special'){
   if(p.badges.indexOf(q.badge)<0){p.badges.push(q.badge);badgeMsg=' You earned the '+q.badge+' badge!';}
   else{badgeMsg=' You already have the '+q.badge+' badge.';}
 }
 renderScores();
 if(ctx.mode==='special'){
   const special=SPACES[ctx.space];
   result.innerHTML='<span class="good">Correct!</span>'+esc(badgeMsg)+'<br>'+esc(special.name+' gives you $'+(special.name==='Pixie Dust'?10:Math.abs(special.amount||100))+'.');
   actions.innerHTML='<button class="primary" id="qContinue">Continue</button>';
   document.getElementById('qContinue').addEventListener('click',function(){
     const msg=applySpecialSpace(ctx.space,true);
     closeModal();finishCorrectAnswer(p.name+' answered correctly. '+msg);
   });
   return;
 }
 if(ctx.mode==='property'){
   const s=SPACES[ctx.space];
   if(owners[ctx.space]!==undefined){
     result.innerHTML='<span class="bad">That attraction is no longer available.</span>';
     actions.innerHTML='<button class="primary" id="propertyContinue">Continue</button>';
     document.getElementById('propertyContinue').addEventListener('click',function(){closeModal();finishTurn(p.name+' could not purchase '+s.name+'.')});
     return;
   }
   if(p.cash<s.cost){
     result.innerHTML='<span class="bad">Purchase cancelled.</span> You no longer have enough Disney Dollars for <strong>'+esc(s.name)+'</strong>.';
     actions.innerHTML='<button class="primary" id="propertyContinue">Continue</button>';
     document.getElementById('propertyContinue').addEventListener('click',function(){closeModal();finishTurn(p.name+' could not afford '+s.name+'.')});

   }

   if(p.props.indexOf(ctx.space)<0)p.props.push(ctx.space);
   owners[ctx.space]=currentPlayer;
   renderAll();
   result.innerHTML='<span class="good">Correct!</span>'+esc(badgeMsg)+'<br><strong>'+esc(s.name)+'</strong> is now yours! <strong>$'+s.cost+'</strong> has been deducted.';

 result.innerHTML='<span class="good">Correct!</span>'+esc(badgeMsg);

 if(!ownedPropertyIndices(currentPlayer).length){advanceTurn(msg);return}

function executePropertyTrade(session,giveIndex,takeIndex){

     if(traded)await animatePinExchange(playerIndex,partnerIndex,giveId,takeId);
     renderAll();showPinTrading();
   }
   document.getElementById('pinTradeAccept').addEventListener('click',function(){complete(true)});
   document.getElementById('pinTradeDecline').addEventListener('click',function(){complete(false)});
 });
}

function showRules(){

2 spaces) around the board. Rolling doubles opens a popup asking whether the rolling player wants to buy one pin not owned by any player for $100, or skip, including on transportation bonus rolls. No doubles cash payout is given. Doubles do not give an extra turn. When you land on an unowned attraction, the game checks whether you can afford it. If you can, choose whether to attempt the purchase; answering the park-themed trivia correctly buys it automatically. If you cannot afford it, your turn ends. Land on another player\'s property to see a rent popup. Choose to pay the rent or use a Magic Rent Pass (the bank pays the owner). If you cannot afford rent and choose &ldquo;I spent all my money at Disney!&rdquo;, your remaining money goes to the owner and you lose the game. Your turns are skipped, your pawn is removed, and your properties return to the bank. Remaining players continue toward the Castle Finale. The four middle-of-the-park <strong>Nighttime Show</strong> spaces cost $200 each and work as a set: rent is $25 with 1 show, $50 with 2, $100 with 3, and $200 with all 4.</p><p>All four corners are <strong>transportation hubs</strong>. If you land exactly on one, you may choose to roll again and travel that many extra spaces. Completing a lap does not pay money.</p><p><strong>Magic &amp; Mischief:</strong> Land on either card space on a park side to draw from the shared pile of 45 cards. Apply its reward, cost, movement, or special perk. Card travel plays the destination normally; laps do not pay money. You may choose to use a Magic Rent Pass in the rent popup; the bank pays the owner. Five Security cards move your pawn to the center Security spot and skip your next turn. Resume from the space you left when you next roll; no lap bonus is paid for being sent to Security. Cards do not repeat until the deck is used up.</p><p>Each of the four parks has its own shuffled deck of <strong>50 expert-level questions</strong> (200 park questions total). Resorts &amp; Dining and Disney History questions are also expert-level. Questions do not repeat within a park until its deck is used up.</p><p>Correct answers on Trivia and Pixie Dust spaces earn category badges. Attraction and nighttime show purchase questions do not award badges. <strong>Pixie Dust</strong> awards $10 for a correct answer. Wrong answers lose no money. <strong>Snack Break</strong> uses a shuffled deck of 30 real Disney food photos; identify the food from four answers to earn $50. To win, collect all six badges, own <strong>all 10 properties in one park, including its Nighttime Show</strong>, and collect <strong>all five pins from that same park</strong>. Then choose the <strong>Cinderella Castle Finale</strong> space in the center instead of rolling and answer the Final Challenge correctly. If you miss the Final Challenge, complete another full lap of the 80-space board before trying again. Backward movement reduces your lap progress; Security trips do not count. Your cash balance and autographs are not win requirements.</p><div class="actions"><button class="primary" id="closeRules">Got It</button></div></div></div>';
 document.getElementById('closeRules').addEventListener('click',closeModal);
}
