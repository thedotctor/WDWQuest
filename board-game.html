     });
   });

function perimeterPos(i){
 if(i<=16)return {r:1,c:i+1};
 if(i<=31)return {r:i-15,c:17};
 if(i<=47)return {r:16,c:48-i};
 return {r:63-i,c:1};
}

}

 SPACES.forEach(function(s,i){

   d.className='space '+s.type+(s.park?' park-'+parkClass(s.park):'');
   d.id='space'+i;
   d.style.gridRow=String(p.r);d.style.gridColumn=String(p.c);

async function animateDice(finalRoll){

async function movePlayerSpaces(steps,label){

   const before=p.pos;

     p.cash+=200;
     addLog(p.name+' completed a lap and collected $200.');
     renderScores();

   renderTokens();
   setStatus(esc(p.name)+' '+esc(label||'moves')+' • '+(step+1)+' of '+steps);

async function resolveSpace(idx,fromTransport){
 const s=SPACES[idx],p=players[currentPlayer];
 if(s.type==='start'){p.cash+=100;finishTurn(p.name+' gets a $100 welcome bonus.');return}
 if(s.type==='property'){
   if(owners[idx]===undefined){askQuestion(s.badge,{mode:'property',space:idx});return}
   if(owners[idx]===currentPlayer){finishTurn(p.name+' already owns '+s.name+'.');return}
   const owner=players[owners[idx]];p.cash-=s.rent;owner.cash+=s.rent;renderScores();finishTurn(p.name+' paid '+owner.name+' $'+s.rent+' rent at '+s.name+'.');return
 }
 if(s.type==='trivia'){askQuestion(s.badge||null,{mode:'badge'});return}
 if(s.type==='special'){askQuestion(null,{mode:'special',space:idx});return}
 if(s.type==='transport'){
   if(fromTransport){finishTurn(p.name+' arrived at '+s.name+' after bonus travel.');return}
   showTransportChoice(idx);return
 }
 if(s.type==='final'){
   if(p.badges.length===BADGES.length){askQuestion(null,{mode:'final'});return}
   askQuestion('Disney History',{mode:'badge',finalGate:true});return
 }
 finishTurn('Turn complete.');
}
function pickQuestion(badge,finalMode){
 let pool=QUESTION_BANK.filter(function(q){return !badge||q.badge===badge});
 if(finalMode){const experts=pool.filter(function(q){return q.diff==='Expert'});if(experts.length)pool=experts}
 if(!pool.length)pool=QUESTION_BANK.slice();
 let idx=Math.floor(Math.random()*pool.length);
 let q=pool[idx];
 if(QUESTION_BANK.indexOf(q)===lastQuestion&&pool.length>1){q=pool[(idx+1)%pool.length]}
 lastQuestion=QUESTION_BANK.indexOf(q);return q;
}
function landedSpotMarkup(spaceIndex,questionBadge){
 const s=SPACES[spaceIndex]||SPACES[0];
 let kind='Board Space';
 let details=[];
 if(s.type==='property'){
   kind='Attraction';
   details.push(s.badge||questionBadge||'Trivia');
   details.push('Buy $'+s.cost);
   details.push('Rent $'+s.rent);
   details.push(owners[spaceIndex]===undefined?'Unowned':'Owned by '+players[owners[spaceIndex]].name);
 }else if(s.type==='trivia'){
   kind=s.badge==='Disney History'?'History Challenge':'Trivia Challenge';
   details.push(s.badge||questionBadge||'Random category');
 }else if(s.type==='final'){
   kind='Final Challenge';
   details.push('Collect all 6 badges to play for the win');
 }else if(s.type==='transport'){
   kind='Transportation Corner';
   details.push('Optional bonus reroll');
 }else if(s.type==='special'){
   kind='Special Space';
   details.push(s.amount>0?'After question: +$'+s.amount:'After question: -$'+Math.abs(s.amount));
   details.push(questionBadge||'Random trivia');
 }else if(s.type==='start'){
   kind='Park Entrance';
 }
 return '<div class="landed-card">'+
   '<div class="landed-icon">'+s.icon+'</div>'+
   '<div><div class="landed-kicker">You landed on • '+esc(kind)+'</div>'+
   '<div class="landed-name">'+esc(s.name)+'</div>'+
   (details.length?'<div class="landed-details">'+details.map(function(x){return '<span class="landed-detail">'+esc(x)+'</span>'}).join('')+'</div>':'')+
   '</div></div>';
}
function askQuestion(badge,ctx){
 const p=players[currentPlayer];
 if(ctx.mode==='badge'&&!badge){
   const missing=BADGES.filter(function(b){return p.badges.indexOf(b)<0});
   if(missing.length)badge=missing[Math.floor(Math.random()*missing.length)];
 }
 const q=pickQuestion(badge,ctx.mode==='final');
 const landedInfo=landedSpotMarkup(p.pos,q.badge);
 modalRoot.innerHTML='<div class="modal-backdrop"><div class="modal"><div class="badge">'+esc(ctx.mode==='final'?'FINAL CHALLENGE':q.badge)+'</div>'+landedInfo+'<h2>'+(ctx.mode==='property'?'Answer to unlock the attraction':'Trivia Challenge')+'</h2><div class="question">'+esc(q.q)+'</div><div class="answers" id="qAnswers"></div><div class="result" id="qResult"></div><div class="actions" id="qActions"></div></div></div>';
 const answers=document.getElementById('qAnswers');
 shuffle(q.choices).forEach(function(choice){
   const b=document.createElement('button');b.className='answer';b.textContent=choice;
   b.addEventListener('click',function(){gradeQuestion(choice,q,ctx,b)});
   answers.appendChild(b);
 });
}
function applySpecialSpace(spaceIndex){
 const s=SPACES[spaceIndex],p=players[currentPlayer];
 if(!s||s.type!=='special')return '';
 p.cash+=s.amount;
 renderScores();
 if(s.amount>0)return p.name+' found '+s.name+' and gained $'+s.amount+'.';
 return p.name+' landed on '+s.name+' and spent $'+Math.abs(s.amount)+'.';
}
function gradeQuestion(choice,q,ctx,btn){
 const buttons=Array.from(document.querySelectorAll('#qAnswers .answer'));buttons.forEach(function(b){b.disabled=true;if(b.textContent===q.a)b.classList.add('correct')});
 const ok=choice===q.a;if(!ok)btn.classList.add('wrong');
 const result=document.getElementById('qResult'),actions=document.getElementById('qActions');
 const p=players[currentPlayer];
 if(!ok){
   result.innerHTML='<span class="bad">Not quite.</span> Answer: '+esc(q.a);
   if(ctx.mode==='special'){
     const special=SPACES[ctx.space];
     result.innerHTML+='<br>'+esc(special.amount>0?special.name+' will still give you $'+special.amount+'.':special.name+' will still cost you $'+Math.abs(special.amount)+'.');
   }
   actions.innerHTML='<button class="primary" id="qContinue">Continue</button>';
   document.getElementById('qContinue').addEventListener('click',function(){
     if(ctx.mode==='special'){
       const msg=applySpecialSpace(ctx.space);
       closeModal();finishTurn(p.name+' missed the '+q.badge+' question. '+msg);return;
     }
     closeModal();finishTurn(p.name+' missed the '+q.badge+' question.');
   });
   return;
 }
 if(ctx.mode==='final'){
   result.innerHTML='<span class="good">Correct!</span> '+esc(p.name)+' wins WDWQuest!';
   actions.innerHTML='<button class="primary" id="winClose">See Final Board</button>';
   document.getElementById('winClose').addEventListener('click',function(){gameOver=true;closeModal();setStatus('<span class="gold">🏆 '+esc(p.name)+' wins WDWQuest!</span>');renderScores();document.getElementById('rollBtn').disabled=true;addLog(p.name+' won the game!')});
   return;
 }
 let badgeMsg='';
 if(p.badges.indexOf(q.badge)<0){p.badges.push(q.badge);badgeMsg=' You earned the '+q.badge+' badge!';}
 else{p.cash+=100;badgeMsg=' You already had that badge, so you earned $100 instead.';}
 renderScores();
 if(ctx.mode==='special'){
   const special=SPACES[ctx.space];
   result.innerHTML='<span class="good">Correct!</span>'+esc(badgeMsg)+'<br>'+esc(special.amount>0?special.name+' gives you $'+special.amount+'.':special.name+' costs you $'+Math.abs(special.amount)+'.');
   actions.innerHTML='<button class="primary" id="qContinue">Continue</button>';
   document.getElementById('qContinue').addEventListener('click',function(){
     const msg=applySpecialSpace(ctx.space);
     closeModal();finishTurn(p.name+' answered correctly. '+msg);
   });
   return;
 }
 if(ctx.mode==='property'){
   const s=SPACES[ctx.space];
   result.innerHTML='<span class="good">Correct!</span>'+esc(badgeMsg)+'<br>You may buy <strong>'+esc(s.name)+'</strong> for $'+s.cost+'.';
   if(p.cash>=s.cost){
     actions.innerHTML='<button class="primary" id="buyProp">Buy Attraction</button><button class="secondary" id="passProp">Pass</button>';
     document.getElementById('buyProp').addEventListener('click',function(){p.cash-=s.cost;p.props.push(ctx.space);owners[ctx.space]=currentPlayer;renderAll();closeModal();finishTurn(p.name+' bought '+s.name+' for $'+s.cost+'.')});
   }else{
     actions.innerHTML='<button class="primary" id="passProp">Continue</button>';
     result.innerHTML+='<br><span class="bad">You do not have enough Disney Dollars to buy it.</span>';
   }
   document.getElementById('passProp').addEventListener('click',function(){closeModal();finishTurn(p.name+' passed on '+s.name+'.')});
   return;
 }
 result.innerHTML='<span class="good">Correct!</span>'+esc(badgeMsg);
 actions.innerHTML='<button class="primary" id="qContinue">Continue</button>';
 document.getElementById('qContinue').addEventListener('click',function(){closeModal();finishTurn(p.name+' answered correctly and now has '+p.badges.length+'/6 badges.')});
}
function closeModal(){modalRoot.innerHTML=''}
function finishTurn(msg){
 addLog(msg);renderAll();
 if(gameOver)return;
 const previous=players[currentPlayer].name;
 currentPlayer=(currentPlayer+1)%players.length;
 turnLocked=false;
 movingPlayer=-1;
 renderAll();
 setStatus(esc(msg)+'<br><strong>'+esc(players[currentPlayer].name)+"'s turn.</strong>");
}
function showRules(){
 modalRoot.innerHTML='<div class="modal-backdrop"><div class="modal"><h2>Quick Rules</h2><p>The board has <strong>62 spaces</strong>. Each side is themed to one park: Magic Kingdom, EPCOT, Hollywood Studios, and Animal Kingdom.</p><p>Choose a unique token, roll the die, and move around the board. Unowned attractions require a correct park-themed trivia answer before you can buy them. Land on another player\'s attraction and pay rent.</p><p>All four corners are <strong>transportation hubs</strong>. If you land exactly on one, you may choose to roll again and travel that many extra spaces. Completing a full lap earns $200.</p><p>Correct trivia earns category badges. Collect all six badges, then land on <strong>Cinderella Castle Finale</strong> and answer the Final Challenge correctly to win.</p><div class="actions"><button class="primary" id="closeRules">Got It</button></div></div></div>';
 document.getElementById('closeRules').addEventListener('click',closeModal);
}
showSetup();
