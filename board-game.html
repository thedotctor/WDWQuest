let snackDeck=[];
let lastSnackName='';
function commonsSnackImage(file,width){
 return 'https://commons.wikimedia.org/wiki/Special:Redirect/file/'+encodeURIComponent(file)+(width?'?width='+width:'');
}
function commonsSnackSource(file){
 return 'https://commons.wikimedia.org/wiki/File:'+encodeURIComponent(file).replace(/%20/g,'_');
}
function snackNameMask(snack){
 if(!snack.mask)return '';
 return '<div class="snack-name-mask" id="snackNameMask" aria-hidden="true"></div>';
}
function positionSnackNameMask(snack,photo){
 if(!snack.mask||!photo||!photo.naturalWidth||!photo.naturalHeight)return;
 const mask=document.getElementById('snackNameMask');
 const frame=document.getElementById('snackPicture');
 if(!mask||!frame)return;
 const fw=frame.clientWidth,fh=frame.clientHeight;
 const scale=Math.max(fw/photo.naturalWidth,fh/photo.naturalHeight);
 const rw=photo.naturalWidth*scale,rh=photo.naturalHeight*scale;
 const ox=(fw-rw)/2,oy=(fh-rh)/2;
 const m=snack.mask;
 mask.style.left=(ox+(m.left/100)*rw)+'px';
 mask.style.top=(oy+(m.top/100)*rh)+'px';
 mask.style.width=((m.width/100)*rw)+'px';
 mask.style.height=((m.height/100)*rh)+'px';
}
function refillSnackDeck(){
 snackDeck=shuffle(SNACK_BREAKS.map(function(s,i){return i}));
}
function pickSnackBreak(){
 if(!snackDeck.length)refillSnackDeck();
 if(lastSnackName&&snackDeck.length>1&&SNACK_BREAKS[snackDeck[snackDeck.length-1]].name===lastSnackName){
   const alt=snackDeck.findIndex(function(i){return SNACK_BREAKS[i].name!==lastSnackName});
   if(alt>=0){
     const last=snackDeck.length-1;
     const tmp=snackDeck[alt];snackDeck[alt]=snackDeck[last];snackDeck[last]=tmp;
   }
 }
 const snack=SNACK_BREAKS[snackDeck.pop()];
 lastSnackName=snack.name;
 return snack;
}
function snackChoices(snack){
 const names=[];
 shuffle(SNACK_BREAKS.slice()).forEach(function(s){
   if(s.name!==snack.name&&names.indexOf(s.name)<0&&names.length<3)names.push(s.name);
 });
 return shuffle([snack.name].concat(names));
}
function askSnackBreak(spaceIndex){
 const snack=pickSnackBreak();
 modalRoot.innerHTML='<div class="modal-backdrop"><div class="modal snack-modal"><div class="badge">🍿 SNACK BREAK • CORRECT +$50</div><div class="snack-kicker">Mystery Disney Food • 30 Photo Deck</div><div class="snack-picture" id="snackPicture"><img id="snackPhoto" data-snack-file="'+esc(snack.file)+'" alt="Mystery Disney food photo">'+snackNameMask(snack)+'</div><div class="snack-credit">Photo: <a href="'+commonsSnackSource(snack.file)+'" target="_blank" rel="noopener">'+esc(snack.credit)+'</a> • <a href="'+snack.licenseUrl+'" target="_blank" rel="noopener">'+esc(snack.license)+'</a></div><div class="snack-question">What food is this?</div><div class="snack-reward">Correct answer earns $50 Disney Dollars</div><div class="answers" id="snackAnswers"></div><div class="result" id="snackResult"></div><div class="actions" id="snackActions"></div></div></div>';
 const photo=document.getElementById('snackPhoto');
 let triedFallback=false;
 photo.onload=function(){positionSnackNameMask(snack,photo)};
 photo.onerror=function(){
   if(!triedFallback){
     triedFallback=true;
     photo.src=commonsSnackImage(snack.file,0);
     return;
   }
   document.getElementById('snackPicture').innerHTML='<div class="snack-load-error">This photo could not load in this browser.</div>';
 };
 photo.src=commonsSnackImage(snack.file,960);
 const answers=document.getElementById('snackAnswers');
 snackChoices(snack).forEach(function(choice){
   const b=document.createElement('button');
   b.className='answer';
   b.textContent=choice;
   b.addEventListener('click',function(){gradeSnackBreak(choice,snack,b)});
   answers.appendChild(b);
 });
}
function gradeSnackBreak(choice,snack,btn){
 const buttons=Array.from(document.querySelectorAll('#snackAnswers .answer'));
 const ok=choice===snack.name;
 buttons.forEach(function(b){b.disabled=true;if(b.textContent===snack.name)b.classList.add('correct')});
 if(!ok)btn.classList.add('wrong');
 const p=players[currentPlayer];
 const result=document.getElementById('snackResult');
 const actions=document.getElementById('snackActions');
 if(ok){
   p.cash+=50;
   renderScores();
   result.innerHTML='<span class="good">Correct!</span> That is '+esc(snack.name)+'. You earned <strong>$50</strong>!';
 }else{
   result.innerHTML='<span class="bad">Not quite.</span> That was <strong>'+esc(snack.name)+'</strong>.';
 }
 actions.innerHTML='<button class="primary" id="snackContinue">Continue</button>';
 document.getElementById('snackContinue').addEventListener('click',function(){
   closeModal();
   const msg=ok?p.name+' identified '+snack.name+' and earned $50.':p.name+' missed the Snack Break. The answer was '+snack.name+'.';
   if(ok)finishCorrectAnswer(msg);else finishTurn(msg);
 });
}

function boardRect(i){
 const board=document.getElementById('board');
 const previousOuter=Math.min(1557,(window.innerWidth-(window.innerWidth<=760?20:184))*.9);
 const corner=(7*1.10*1.22*1.25)*(previousOuter-6)/board.clientWidth;
 const along=(100-2*corner)/17,depth=corner;
 const side=Math.floor(i/18),step=i%18;
 const cornerSize=corner;
 if(step===0){
   return {top:side<2?0:100-cornerSize,left:side===0||side===3?0:100-cornerSize,width:cornerSize,height:cornerSize,side:['top','right','bottom','left'][side]};
 }
 const offset=corner+(step-1)*along;
 if(side===0)return {top:0,left:offset,width:along,height:depth,side:'top'};
 if(side===1)return {top:offset,left:100-depth,width:depth,height:along,side:'right'};
 if(side===2)return {top:100-depth,left:100-offset-along,width:along,height:depth,side:'bottom'};
 return {top:100-offset-along,left:0,width:depth,height:along,side:'left'};
}

function drawFinaleFireworks(){

 for(let i=finaleFireworksParticles.length-1;i>=0;i--){
   const p=finaleFireworksParticles[i];
   p.x+=p.vx;p.y+=p.vy;p.vy+=.038;p.vx*=.994;p.life-=1;
   const alpha=Math.max(0,p.life/p.maxLife);
   finaleFireworksCtx.globalAlpha=alpha;
   finaleFireworksCtx.shadowBlur=10;
   finaleFireworksCtx.shadowColor=p.color;
   finaleFireworksCtx.fillStyle=p.color;
   finaleFireworksCtx.beginPath();
   finaleFireworksCtx.arc(p.x,p.y,p.size,0,Math.PI*2);
   finaleFireworksCtx.fill();
   if(p.life<=0)finaleFireworksParticles.splice(i,1);
 }
 finaleFireworksCtx.globalAlpha=1;

   if(escort.animate)await escort.animate([{transform:'translate(0,0)'},{transform:transform}],{duration:1400,easing:'cubic-bezier(.4,0,.2,1)',fill:'forwards'}).finished;
   else{escort.style.transform=transform;await wait(1400)}
   await wait(250);
 }catch(animationError){
   // A canceled browser animation must never prevent the card from resolving.
 }finally{
   source.style.visibility='';layer.remove();
 }
}
function applyMagicInstantEffect(card,playerIndex){
 const p=players[playerIndex];
 let amount=0;
 if(card.effect==='cash'){p.cash+=card.amount;return p.name+(card.amount>=0?' collected $':' paid $')+Math.abs(card.amount)+'.'}
 if(card.effect==='rentPass'){p.rentPasses=(p.rentPasses||0)+1;return p.name+' received a Magic Rent Pass for the next rent payment.'}
 if(card.effect==='propertyBonus'){amount=Math.max(20,Math.min(100,p.props.length*20));p.cash+=amount;return p.name+' collected a $'+amount+' Park Partner Bonus.'}
 if(card.effect==='maintenance'){amount=Math.max(10,Math.min(75,p.props.length*10));p.cash-=amount;return p.name+' paid $'+amount+' in maintenance.'}
 if(card.effect==='collectPlayers'){
   if(players.length===1){p.cash+=50;return p.name+' collected $50 from the bank.'}
   players.forEach(function(other,i){if(i!==playerIndex){other.cash-=25;p.cash+=25}});
   return p.name+' collected $25 from each other player ($'+((players.length-1)*25)+' total).';
 }
 if(card.effect==='payPlayers'){
   if(players.length===1){p.cash-=25;return p.name+' paid $25 to the bank.'}
   players.forEach(function(other,i){if(i!==playerIndex){other.cash+=25;p.cash-=25}});
   return p.name+' paid $25 to each other player ($'+((players.length-1)*25)+' total).';
 }
 if(card.effect==='richestGift'){
   let richest=-1;
   players.forEach(function(other,i){if(i!==playerIndex&&(richest<0||other.cash>players[richest].cash))richest=i});
   p.cash+=50;
   if(richest<0)return p.name+' received $50 from the bank.';
   players[richest].cash-=50;
   return players[richest].name+' gave '+p.name+' $50.';
 }
 throw new Error('Unknown Magic & Mischief effect: '+card.effect);
}
function magicTravelDistance(card,from){
 if(card.effect==='move')return card.steps;
 for(let steps=1;steps<=SPACES.length;steps++){
   const s=SPACES[(from+steps)%SPACES.length];
   if((card.target==='transport'&&s.type==='transport')||(card.target==='show'&&s.show)||(card.target==='snack'&&s.name==='Snack Break'))return steps;
 }
 return 0;
}
async function applyMagicCard(card){
 const p=players[currentPlayer];
 if(card.effect==='autograph'){
   showAutographEncounter(currentPlayer,function(){finishTurn(p.name+' drew '+card.title+'.')});
   return;
 }
 if(card.effect==='security'){
   await animateSecurityEscort(currentPlayer);
   p.inSecurity=true;p.skipTurns=1;
   movingPlayer=currentPlayer;renderAll();
   const spot=document.getElementById('securitySpot');
   if(spot)spot.scrollIntoView({behavior:reducedMotion()?'auto':'smooth',block:'center',inline:'center'});
   setStatus(esc(p.name)+' goes to <strong>Park Security</strong> and will miss the next turn.');
   if(!reducedMotion())await wait(900);
   movingPlayer=-1;
   finishTurn(p.name+' drew '+card.title+'. Sent to Security: miss the next turn. No lap bonus.');
   return;
 }
 if(card.effect==='move'||card.effect==='destination'){
   const steps=magicTravelDistance(card,p.pos);
   addLog(p.name+' drew '+card.title+'. '+card.text);
   if(!steps){finishTurn(p.name+' stayed in place.');return}
   await movePlayerSpaces(steps,steps<0?'moves backward':'travels with Magic & Mischief');
   renderScores();
   setStatus(esc(p.name)+' reached <strong>'+esc(SPACES[p.pos].name)+'</strong>.');
   await pauseAfterLanding(p.pos);
   await resolveSpace(p.pos,false);
   return;
 }
 const message=applyMagicInstantEffect(card,currentPlayer);
 finishTurn(p.name+' drew '+card.title+'. '+message);
}

function pickQuestion(badge,finalMode){
 const categories=Array.from(new Set(QUESTION_BANK.map(function(q){return q.badge})));
 categories.forEach(function(category){if(!questionDecks[category])refillQuestionDeck(category)});
 if(!categories.includes(badge)){
   let available=categories.filter(function(category){return questionDecks[category].length>0});
   if(!available.length){categories.forEach(refillQuestionDeck);available=categories.slice()}
   if(finalMode){
     const withExperts=available.filter(function(category){return questionDecks[category].some(function(i){return QUESTION_BANK[i].diff==='Expert'})});
     if(withExperts.length)available=withExperts;
   }
   badge=available[Math.floor(Math.random()*available.length)];
 }
 const deck=questionDecks[badge].length?questionDecks[badge]:refillQuestionDeck(badge);
 let position=deck.length-1;
 if(finalMode){
   const expert=deck.findIndex(function(i){return QUESTION_BANK[i].diff==='Expert'&&i!==lastQuestionsByBadge[badge]});
   if(expert>=0)position=expert;
 }
 const index=deck.splice(position,1)[0];
 lastQuestion=index;lastQuestionsByBadge[badge]=index;
 return QUESTION_BANK[index];
}
function landedSpotMarkup(spaceIndex,questionBadge){
 const s=SPACES[spaceIndex]||SPACES[0];
 let kind='Board Space';
 let details=[];
 if(s.type==='property'){
   kind=isShowSpace(s)?'Nighttime Show':'Attraction';
   details.push(s.badge||questionBadge||'Trivia');
   details.push('Buy $'+s.cost);
   if(isShowSpace(s)){
     if(owners[spaceIndex]===undefined)details.push('Show rent $25 → $200');
     else details.push('Rent $'+rentForSpace(spaceIndex)+' • Shows '+showSpacesOwned(owners[spaceIndex])+'/4');
   }else details.push('Rent $'+s.rent);
   details.push(owners[spaceIndex]===undefined?'Unowned':'Owned by '+players[owners[spaceIndex]].name);
 }else if(s.type==='trivia'){
   kind=s.badge==='Disney History'?'History Challenge':'Trivia Challenge';
   details.push(s.badge||questionBadge||'Random category');
 }else if(s.type==='final'){
   kind='Final Challenge';
   details.push('Collect all 6 badges to play for the win');
 }else if(s.type==='transport'){
   kind='Transportation Corner';
   details.push('Optional bonus reroll');
 }else if(s.type==='magic'){
   kind='Magic & Mischief';
   details.push('Draw 1 card from the shared 43-card pile');
 }else if(s.type==='special'){
   kind='Special Space';
   if(s.name==='Snack Break'){
     details.push('Guess the pictured snack');
     details.push('Correct: +$'+(s.reward||50));
   }else{
     details.push('Correct: +$'+Math.abs(s.amount||100));
     details.push('Wrong: -$'+Math.abs(s.amount||100));
     details.push(questionBadge||'Random trivia');
   }
 }else if(s.type==='start'){
   kind='Park Entrance';
 }
 return '<div class="landed-card">'+
   '<div class="landed-icon">'+s.icon+'</div>'+
   '<div><div class="landed-kicker">You landed on • '+esc(kind)+'</div>'+
   '<div class="landed-name">'+esc(s.name)+'</div>'+
   (details.length?'<div class="landed-details">'+details.map(function(x){return '<span class="landed-detail">'+esc(x)+'</span>'}).join('')+'</div>':'')+
   '</div></div>';
}
function askQuestion(badge,ctx){
 const p=players[currentPlayer];
 if(ctx.mode==='badge'&&!badge){
   const missing=BADGES.filter(function(b){return p.badges.indexOf(b)<0});
   if(missing.length)badge=missing[Math.floor(Math.random()*missing.length)];
 }
 const q=pickQuestion(badge,ctx.mode==='final');
 const landedInfo=ctx.mode==='final'?'<div class="landed-card"><div class="landed-icon">🏰</div><div><div class="landed-kicker">Center Space • Final Challenge</div><div class="landed-name">Cinderella Castle Finale</div><div class="landed-details"><span class="landed-detail">All 6 badges collected</span><span class="landed-detail">Correct answer wins</span></div></div></div>':landedSpotMarkup(p.pos,q.badge);
 modalRoot.innerHTML='<div class="modal-backdrop"><div class="modal"><div class="badge">'+esc(ctx.mode==='final'?'FINAL CHALLENGE':q.badge)+'</div>'+landedInfo+'<h2>'+(ctx.mode==='property'?'Answer Correctly to Buy It':'Trivia Challenge')+'</h2><div class="question">'+esc(q.q)+'</div><div class="answers" id="qAnswers"></div><div class="result" id="qResult"></div><div class="actions" id="qActions"></div></div></div>';
 const answers=document.getElementById('qAnswers');
 shuffle(q.choices).forEach(function(choice){
   const b=document.createElement('button');b.className='answer';b.textContent=choice;
   b.addEventListener('click',function(){gradeQuestion(choice,q,ctx,b)});
   answers.appendChild(b);
 });
}
function applySpecialSpace(spaceIndex,correct){
 const s=SPACES[spaceIndex],p=players[currentPlayer];
 if(!s||s.type!=='special'||s.name==='Snack Break')return '';
 const amount=Math.abs(s.amount||100);
 if(correct){
   p.cash+=amount;
   renderScores();
   return p.name+' answered correctly at '+s.name+' and gained $'+amount+'.';
 }
 p.cash-=amount;
 renderScores();
 return p.name+' answered incorrectly at '+s.name+' and lost $'+amount+'.';
}
function gradeQuestion(choice,q,ctx,btn){
 const buttons=Array.from(document.querySelectorAll('#qAnswers .answer'));buttons.forEach(function(b){b.disabled=true;if(b.textContent===q.a)b.classList.add('correct')});
 const ok=choice===q.a;if(!ok)btn.classList.add('wrong');
 const result=document.getElementById('qResult'),actions=document.getElementById('qActions');
 const p=players[currentPlayer];
 if(!ok){
   result.innerHTML='<span class="bad">Not quite.</span> Answer: '+esc(q.a);
   if(ctx.mode==='special'){
     const special=SPACES[ctx.space];
     result.innerHTML+='<br>'+esc(special.name+' takes $'+Math.abs(special.amount||100)+' for an incorrect answer.');
   }
   if(ctx.mode==='property'){
     const property=SPACES[ctx.space];
     result.innerHTML+='<br>You do not purchase <strong>'+esc(property.name)+'</strong>.';
   }
   actions.innerHTML='<button class="primary" id="qContinue">Continue</button>';
   document.getElementById('qContinue').addEventListener('click',function(){
     if(ctx.mode==='special'){
       const msg=applySpecialSpace(ctx.space,false);
       closeModal();finishTurn(p.name+' missed the '+q.badge+' question. '+msg);return;
     }
     closeModal();finishTurn(p.name+' missed the '+q.badge+' question.');
   });
   return;
 }
 if(ctx.mode==='final'){
   startFinaleFireworks(4200);
   result.innerHTML='<span class="good">Correct!</span> '+esc(p.name)+' wins WDWQuest!';
   actions.innerHTML='<button class="primary" id="winClose">See Final Board</button>';
   document.getElementById('winClose').addEventListener('click',function(){gameOver=true;closeModal();setStatus('<span class="gold">🏆 '+esc(p.name)+' wins WDWQuest!</span>');renderAll();addLog(p.name+' won the game!')});
   return;
 }
 let badgeMsg='';
 if(p.badges.indexOf(q.badge)<0){p.badges.push(q.badge);badgeMsg=' You earned the '+q.badge+' badge!';}
 else{p.cash+=100;badgeMsg=' You already had that badge, so you earned $100 instead.';}
 renderScores();
 if(ctx.mode==='special'){
   const special=SPACES[ctx.space];
   result.innerHTML='<span class="good">Correct!</span>'+esc(badgeMsg)+'<br>'+esc(special.name+' gives you $'+Math.abs(special.amount||100)+'.');
   actions.innerHTML='<button class="primary" id="qContinue">Continue</button>';
   document.getElementById('qContinue').addEventListener('click',function(){
     const msg=applySpecialSpace(ctx.space,true);
     closeModal();finishCorrectAnswer(p.name+' answered correctly. '+msg);
   });
   return;
 }
 if(ctx.mode==='property'){
   const s=SPACES[ctx.space];
   if(owners[ctx.space]!==undefined){
     result.innerHTML='<span class="bad">That attraction is no longer available.</span>';
     actions.innerHTML='<button class="primary" id="propertyContinue">Continue</button>';
     document.getElementById('propertyContinue').addEventListener('click',function(){closeModal();finishTurn(p.name+' could not purchase '+s.name+'.')});
     return;
   }
   if(p.cash<s.cost){
     result.innerHTML='<span class="bad">Purchase cancelled.</span> You no longer have enough Disney Dollars for <strong>'+esc(s.name)+'</strong>.';
     actions.innerHTML='<button class="primary" id="propertyContinue">Continue</button>';
     document.getElementById('propertyContinue').addEventListener('click',function(){closeModal();finishTurn(p.name+' could not afford '+s.name+'.')});
     return;
   }
   p.cash-=s.cost;
   if(p.props.indexOf(ctx.space)<0)p.props.push(ctx.space);
   owners[ctx.space]=currentPlayer;
   renderAll();
   result.innerHTML='<span class="good">Correct!</span>'+esc(badgeMsg)+'<br><strong>'+esc(s.name)+'</strong> is now yours! <strong>$'+s.cost+'</strong> has been deducted.';
   actions.innerHTML='<button class="primary" id="propertyContinue">Continue</button>';
   document.getElementById('propertyContinue').addEventListener('click',function(){
     closeModal();
     finishCorrectAnswer(p.name+' bought '+s.name+' for $'+s.cost+'.');
   });
   return;
 }
 result.innerHTML='<span class="good">Correct!</span>'+esc(badgeMsg);
 actions.innerHTML='<button class="primary" id="qContinue">Continue</button>';
 document.getElementById('qContinue').addEventListener('click',function(){closeModal();finishCorrectAnswer(p.name+' answered correctly and now has '+p.badges.length+'/6 badges.')});
}
window.addEventListener('resize',function(){
 const photo=document.getElementById('snackPhoto');
 if(!photo||!photo.complete)return;
 const currentFile=photo.getAttribute('data-snack-file');
 if(!currentFile)return;
 const snack=SNACK_BREAKS.find(function(s){return s.file===currentFile});
 if(snack)positionSnackNameMask(snack,photo);
});
function finishCorrectAnswer(message){
 if(!gameOver&&Math.random()<.25){
   showAutographEncounter(currentPlayer,function(){finishTurn(message)});
 }else finishTurn(message);
}
function autographPortrait(character,small){
 return '<div class="autograph-portrait '+(small?'small ':'')+(character.imageCrop?'crop crop-'+character.imageCrop:'')+'"><img src="'+esc(character.image)+'" alt="'+esc(character.name)+'" loading="'+(small?'lazy':'eager')+'" decoding="async" referrerpolicy="no-referrer" onerror="this.hidden=true;this.nextElementSibling.hidden=false"><span class="autograph-picture-fallback" hidden aria-label="Picture unavailable">'+character.icon+'</span></div><small class="autograph-image-credit"><a href="'+esc(character.imageSource)+'" target="_blank" rel="noopener noreferrer">Image: '+esc(character.imageCredit)+'</a></small>';
}
function collectAutograph(playerIndex){
 const p=players[playerIndex];
 if(!p.autographs)p.autographs=[];
 const missing=AUTOGRAPH_CHARACTERS.filter(function(c){return !p.autographs.includes(c.id)});
 const pool=missing.length?missing:AUTOGRAPH_CHARACTERS;
 const character=pool[Math.floor(Math.random()*pool.length)];
 const isNew=!p.autographs.includes(character.id);
 if(isNew)p.autographs.push(character.id);
 p.cash+=50;
 addLog(p.name+' collected '+character.name+'\'s autograph and $50.'+(isNew?'':' (Book already complete.)'));
 renderScores();
 return {character:character,isNew:isNew};
}
function showAutographEncounter(playerIndex,onContinue){
 turnLocked=true;
 const p=players[playerIndex],reward=collectAutograph(playerIndex),character=reward.character;
 renderAll();
 const colors=['#ffd166','#ef476f','#06d6a0','#71c9ff','#c9a5ff'];
 const confetti=Array.from({length:45},function(_,i){return '<i style="left:'+(i*37%100)+'%;--confetti-color:'+colors[i%colors.length]+';--confetti-delay:'+(i%9*.07)+'s;--confetti-top:'+(i*19%100)+'%"></i>'}).join('');
 modalRoot.innerHTML='<div class="modal-backdrop"><div class="modal autograph-modal"><div class="autograph-confetti" aria-hidden="true">'+confetti+'</div><div class="badge">🎉 SURPRISE CHARACTER ENCOUNTER</div><h2>'+esc(character.name)+' is here!</h2><p>'+esc(p.name)+', you got '+esc(character.name)+'\'s autograph!</p><div class="autograph-page">'+autographPortrait(character,false)+'<strong>'+esc(character.name)+'</strong><div class="autograph-signature">'+esc(character.name)+'</div><small>WDWQuest autograph • stylized signature</small></div><p class="good"><strong>+$50 added to your bank!</strong></p><p>'+(reward.isNew?'Added to your Autograph Book.':'Your book is complete! This repeat visit still earns $50.')+' '+p.autographs.length+'/50 collected.</p><div class="actions"><button class="primary" id="autographContinue">Continue</button></div></div></div>';
 document.getElementById('autographContinue').addEventListener('click',function(){
   if(this.disabled)return;
   this.disabled=true;closeModal();onContinue();
 });
}
function showAutographBook(playerIndex){
 if(turnLocked)return;
 const p=players[playerIndex],collected=p.autographs||[];
 modalRoot.innerHTML='<div class="modal-backdrop"><div class="modal"><div class="badge">📖 AUTOGRAPH BOOK</div><h2>'+esc(p.name)+'\'s Character Collection</h2><p>'+collected.length+' of 50 autographs collected. Every autograph earns $50!</p><div class="autograph-grid">'+AUTOGRAPH_CHARACTERS.map(function(c){const have=collected.includes(c.id);return '<div class="autograph-page '+(have?'':'missing')+'">'+(have?autographPortrait(c,true):'<div class="autograph-locked" aria-hidden="true">🔒</div>')+'<strong>'+esc(c.name)+'</strong><div class="autograph-signature">'+(have?esc(c.name):'Not collected')+'</div></div>'}).join('')+'</div><div class="actions"><button class="primary" id="autographBookClose">Back to Board</button></div></div></div>';
 document.getElementById('autographBookClose').addEventListener('click',closeModal);
}

function closeModal(){modalRoot.innerHTML=''}
function finishTurn(msg){
 const messages=[msg];
 addLog(msg);
 if(gameOver){renderAll();return}
 for(let checked=0;checked<=players.length;checked++){
   currentPlayer=(currentPlayer+1)%players.length;
   const next=players[currentPlayer];
   if(next.skipTurns>0){
     next.skipTurns--;
     const skipped=next.name+' missed a turn at Park Security. Return to the previous space on the next roll.';
     addLog(skipped);messages.push(skipped);
     continue;
   }
   break;
 }
 turnLocked=false;movingPlayer=-1;
 renderAll();
 setStatus(messages.map(esc).join('<br>')+'<br><strong>'+esc(players[currentPlayer].name)+"'s turn.</strong>");
}
function leaveSecurity(player){
 if(!player.inSecurity)return;
 player.inSecurity=false;
 addLog(player.name+' left Park Security and returned to '+SPACES[player.pos].name+'.');
 renderTokens();renderScores();
}
function showRules(){
 modalRoot.innerHTML='<div class="modal-backdrop"><div class="modal"><h2>Quick Rules</h2><p><strong>Autograph Book:</strong> Correct answers (except the winning Final Challenge) have a 25% chance of a surprise character autograph with confetti and a $50 reward. Three Magic &amp; Mischief cards guarantee an autograph. Collect all 50; each new visit chooses a missing character first. After completing your book, repeat autographs still pay $50. Open your book from your player card. Autographs are optional.</p><p>The board has <strong>72 spaces</strong> (17 park spaces on each side, plus four transportation corners). Each side is themed to one park: Magic Kingdom, EPCOT, Hollywood Studios, and Animal Kingdom.</p><p>Choose a unique token, roll the die, and move around the board. When you land on an unowned attraction, the game checks whether you can afford it. If you can, choose whether to attempt the purchase; answering the park-themed trivia correctly buys it automatically. If you cannot afford it, your turn ends. Land on another player\'s property and pay rent. The four middle-of-the-park <strong>Nighttime Show</strong> spaces cost $200 each and work as a set: rent is $25 with 1 show, $50 with 2, $100 with 3, and $200 with all 4.</p><p>All four corners are <strong>transportation hubs</strong>. If you land exactly on one, you may choose to roll again and travel that many extra spaces. Completing a full lap earns $200.</p><p><strong>Magic &amp; Mischief:</strong> Land on either card space on a park side to draw from the shared pile of 43 cards. Apply its reward, cost, movement, or special perk. Card travel plays the destination normally; backward travel does not collect the lap bonus. A Magic Rent Pass covers your next rent payment, and the bank pays the owner. Five Security cards move your pawn to the center Security spot and skip your next turn. Resume from the space you left when you next roll; no lap bonus is paid for being sent to Security. Cards do not repeat until the deck is used up.</p><p>Each of the four parks has its own shuffled deck of <strong>50 questions</strong> (200 park questions total). Questions do not repeat within a park until its deck is used up.</p><p>Correct trivia earns category badges. <strong>Pixie Dust</strong> awards $100 for a correct answer and takes $100 for a wrong answer. <strong>Snack Break</strong> uses a shuffled deck of 30 real Disney food photos; identify the food from four answers to earn $50. Collect all six badges, then choose the <strong>Cinderella Castle Finale</strong> space in the center instead of rolling. Answer the Final Challenge correctly to win.</p><div class="actions"><button class="primary" id="closeRules">Got It</button></div></div></div>';
 document.getElementById('closeRules').addEventListener('click',closeModal);
}
showSetup();
