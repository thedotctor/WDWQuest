const app=document.getElementById('app');
const defaultStats={totalAnswered:0,correct:0,bestStreak:0,streak:0,totalScore:0,gamesPlayed:{},byPark:{},achievements:[]};
let stats=loadStats();

function clone(x){return JSON.parse(JSON.stringify(x));}
function loadStats(){try{return Object.assign(clone(defaultStats),JSON.parse(localStorage.getItem('wdwquest_stats_v02')||'null')||{})}catch(e){return clone(defaultStats)}}
function saveStats(){localStorage.setItem('wdwquest_stats_v02',JSON.stringify(stats));}
function esc(s){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));}
function shuffle(a){const b=[...a];for(let i=b.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[b[i],b[j]]=[b[j],b[i]]}return b;}
function pct(){return stats.totalAnswered?Math.round(stats.correct/stats.totalAnswered*100):0;}
function record(park,ok,points=0){stats.totalAnswered++;if(ok){stats.correct++;stats.streak++;stats.bestStreak=Math.max(stats.bestStreak,stats.streak)}else stats.streak=0;stats.totalScore+=points;if(park){stats.byPark[park]||={answered:0,correct:0};stats.byPark[park].answered++;if(ok)stats.byPark[park].correct++;}unlocks();saveStats();}
function unlocks(){const add=a=>{if(!stats.achievements.includes(a))stats.achievements.push(a)};if(stats.correct>=10)add('🏰 Rope Drop Rookie');if(stats.correct>=25)add('🎢 Park Hopper');if(stats.bestStreak>=10)add('🔥 Ten in a Row');if(stats.totalAnswered>=100)add('🧠 Disney Brain');if((stats.gamesPlayed.photo||0)>=5)add('📸 Eagle Eye');}
function bumpGame(name){stats.gamesPlayed[name]=(stats.gamesPlayed[name]||0)+1;saveStats();}
function nav(v){history.replaceState(null,'','#'+v);render(v);window.scrollTo({top:0,behavior:'smooth'});}
document.addEventListener('click',e=>{const b=e.target.closest('[data-nav]');if(b)nav(b.dataset.nav);});

let gameTeams=[];
let activeGameTeam=0;
let triviaDifficulty='All';
const GAME_TITLES={
  trivia:'WDW Trivia',
  photo:'Where Am I? Photo',
  clues:'Where Am I? Clues',
  history:'What Was Here Before?',
  jeopardy:'WDW Jeopardy',

function teamSetup(gameKey){
  const title=GAME_TITLES[gameKey]||'WDWQuest';
  gameTeams=[{name:'',score:0}];
  activeGameTeam=0;
  app.innerHTML=`<div class="scorebar"><div><div class="eyebrow">Player Setup</div><h2>${esc(title)}</h2></div><span class="badge" id="teamcount">1 player</span></div>
  <section class="panel">
    <div class="j-picker-head"><div><h3>Who is playing?</h3><div class="muted">Play solo, or add up to 4 players total.</div></div></div>
    <div class="j-team-setup" id="gamesetupteams"></div>
    <div class="j-builder-actions">
      <button id="gamestart" class="primary">Start Game</button>
      <button id="gameaddteam" class="secondary">Add Player</button>
      <button id="gamecancel" class="secondary">Back to Arcade</button>
    </div>
    <div id="gameteammsg" class="j-builder-note">Each player will have their own score during this game.</div>
  </section>`;

  function draw(){
    gamesetupteams.innerHTML=gameTeams.map((t,i)=>`<div class="j-team-row">
      <label for="gteam${i}">Player ${i+1}</label>
      <input id="gteam${i}" data-gteam="${i}" ${t.name?'value="'+esc(t.name)+'"':''} placeholder="Player ${i+1}" maxlength="24" autocomplete="new-password" autocapitalize="words">
      ${gameTeams.length>1?'<button type="button" class="secondary j-team-remove" data-gremove="'+i+'">Remove</button>':''}
    </div>`).join('');
    teamcount.textContent=gameTeams.length+(gameTeams.length===1?' player':' players');
    gameaddteam.disabled=gameTeams.length>=4;

    gamesetupteams.querySelectorAll('[data-gteam]').forEach(input=>{
      const i=Number(input.dataset.gteam);
      const defaultName='Player '+(i+1);

      input.addEventListener('focus',()=>{
        if(input.value.trim()===defaultName)input.select();
      });

      input.addEventListener('beforeinput',()=>{
        if(input.value.trim()===defaultName)input.value='';
      });

      input.addEventListener('input',()=>{
        gameTeams[i].name=input.value.slice(0,24);
      });
    });
    gamesetupteams.querySelectorAll('[data-gremove]').forEach(btn=>{
      btn.addEventListener('click',()=>{
        if(gameTeams.length<=1)return;
        gameTeams.splice(Number(btn.dataset.gremove),1);
        draw();
      });
    });
  }

  gameaddteam.addEventListener('click',()=>{
    if(gameTeams.length>=4)return;
    gameTeams.push({name:'',score:0});
    draw();
  });

  gamecancel.addEventListener('click',()=>nav('home'));

  gamestart.addEventListener('click',()=>{
    gameTeams=gameTeams.map((t,i)=>({name:(t.name||'').trim()||('Player '+(i+1)),score:0}));
    const names=gameTeams.map(t=>t.name.toLowerCase());
    if(new Set(names).size!==names.length){
      gameteammsg.textContent='Give each player a different name.';
      gameteammsg.classList.add('bad');
      return;
    }
    activeGameTeam=0;
    if(gameKey==='pin-drop'){
      const encoded=encodeURIComponent(JSON.stringify(gameTeams.map(t=>t.name)));
      window.location.href='pin-drop.html?teams='+encoded+'&v=086';
      return;
    }
    if(gameKey==='trivia'){
      triviaDifficultySetup();
      return;
    }
    launchGame(gameKey);
  });

  draw();
}

function triviaDifficultySetup(){
  app.innerHTML=`<div class="scorebar"><div><div class="eyebrow">Trivia Setup</div><h2>Choose Difficulty</h2></div><span class="badge">${gameTeams.length} player${gameTeams.length===1?'':'s'}</span></div>
  <section class="panel">
    <div class="j-picker-head"><div><h3>How hard should the questions be?</h3><div class="muted">Choose one difficulty for this Trivia game.</div></div></div>
    <div class="trivia-difficulty-grid" id="triviaDifficultyGrid">
      <button type="button" class="difficulty-card" data-diff="Casual"><strong>Casual</strong><span>Easier Disney World questions</span></button>
      <button type="button" class="difficulty-card" data-diff="Fan"><strong>Fan</strong><span>For regular park fans</span></button>
      <button type="button" class="difficulty-card" data-diff="Expert"><strong>Expert</strong><span>Deep-cut Disney World knowledge</span></button>
      <button type="button" class="difficulty-card" data-diff="All"><strong>Mixed</strong><span>A little of everything</span></button>
    </div>
    <div class="j-builder-actions">
      <button id="triviaBackPlayers" class="secondary">Back to Players</button>
    </div>
  </section>`;

  document.querySelectorAll('[data-diff]').forEach(btn=>{
    btn.addEventListener('click',()=>{
      triviaDifficulty=btn.dataset.diff;
      trivia();
    });
  });
  triviaBackPlayers.addEventListener('click',()=>teamSetup('trivia'));
}

function launchGame(v){
  if(v==='trivia')return trivia();
  if(v==='photo')return photoGame();
  if(v==='clues')return clueGame();
  if(v==='history')return historyGame();
  if(v==='jeopardy')return jeopardy();
}

function teamScoreMarkup(){
  return `<section class="j-team-scores game-team-scores" id="gameTeamScores" aria-label="Player scores"></section>
  <div class="j-active-note" id="gameActiveTeam"></div>`;
}

function renderGameTeamScores(){
  const wrap=document.getElementById('gameTeamScores');
  const note=document.getElementById('gameActiveTeam');
  if(!wrap||!note)return;
  wrap.innerHTML=gameTeams.map((t,i)=>{
    const displayScore=t.score<0?'-$'+Math.abs(t.score):'$'+t.score;
    return '<button type="button" class="j-team-score '+(i===activeGameTeam?'active':'')+'" data-game-team="'+i+'">'+
      '<span class="j-team-name">'+esc(t.name)+'</span>'+
      '<strong>'+displayScore+'</strong>'+
    '</button>';
  }).join('');
  note.innerHTML='Playing: <strong>'+esc(gameTeams[activeGameTeam].name)+'</strong> <span class="muted">• tap another player to switch</span>';
  wrap.querySelectorAll('[data-game-team]').forEach(btn=>{
    btn.addEventListener('click',()=>{
      activeGameTeam=Number(btn.dataset.gameTeam);
      renderGameTeamScores();
    });
  });
}

function addGameTeamPoints(points){
  if(!gameTeams.length)return;
  gameTeams[activeGameTeam].score+=points;
  renderGameTeamScores();
}

function advanceGamePlayer(){
  if(gameTeams.length>1)activeGameTeam=(activeGameTeam+1)%gameTeams.length;
  renderGameTeamScores();
}

function trivia(){
const diffLabel=triviaDifficulty==='All'?'Mixed':triviaDifficulty;
app.innerHTML=`<div class="scorebar"><div><div class="eyebrow">Game</div><h2>WDW Trivia</h2></div><div style="display:flex;gap:8px;flex-wrap:wrap"><span class="badge">${esc(diffLabel)}</span><button id="changeTriviaDifficulty" class="secondary">Change Difficulty</button></div></div>

<section class="panel"><div class="badge" id="tm"></div><div class="question" id="tq"></div><div class="answers" id="ta"></div><div class="feedback" id="tf"></div><div class="actions"><button id="tn" class="primary">Next Question</button></div></section>`;

let current=null,answered=false;
function next(){const pool=DATA.trivia.filter(x=>triviaDifficulty==='All'||x.diff===triviaDifficulty);if(!pool.length)return;current=pool[Math.floor(Math.random()*pool.length)];answered=false;tm.textContent=`${current.park} • ${current.cat} • ${current.diff}`;tq.textContent=current.q;tf.textContent='';ta.innerHTML='';shuffle(current.choices).forEach(c=>{const b=document.createElement('button');b.className='answer-btn';b.textContent=c;b.addEventListener('click',()=>{if(answered)return;answered=true;const ok=c===current.a;record(current.park,ok,ok?100:0);if(ok)addGameTeamPoints(100);document.querySelectorAll('#ta button').forEach(x=>{x.disabled=true;if(x.textContent===current.a)x.classList.add('correct')});if(!ok)b.classList.add('wrong');tf.innerHTML=ok?'<span class="good">Correct! +100</span>':`<span class="bad">Not quite.</span> Answer: ${esc(current.a)}`;advanceGamePlayer();});ta.appendChild(b);})}
tn.addEventListener('click',next);bumpGame('trivia');next();

function photoGame(){
app.innerHTML=`<div class="scorebar"><div><div class="eyebrow">Photo Challenge</div><h2>Where Am I? Photo</h2></div><span class="badge">100 → 75 → 50 → 25 points</span></div>
${teamScoreMarkup()}
<div class="notice"><b>Photo Pack 1:</b> 100 reusable WDW photographs credited to Eden, Janine and Jim under CC BY 2.0 via Wikimedia Commons. Each round includes a source/license credit below the image. <b>Note:</b> remote photos may be blocked by ChatGPT's built-in HTML preview; test Photo Mode on the published GitHub Pages site.</div>
<div class="filters"><select id="pp"><option>All</option><option>Magic Kingdom</option><option>EPCOT</option><option>Hollywood Studios</option><option>Animal Kingdom</option><option>Resorts</option><option>Transportation</option></select></div>
<section class="panel">
<div class="scorebar"><span class="badge" id="pm"></span><span class="badge" id="ps">Reveal 1 of 4</span></div>
<div class="photo-frame" id="pf" data-stage="0"><img id="pi" alt="Walt Disney World photo puzzle"><div class="photo-cover-note">Zoomed photo • reveal more if needed</div></div>
<div class="photo-credit" id="pcredit"></div>
<div class="answers" id="pa" style="margin-top:16px"></div><div class="feedback" id="pfeed"></div>
<div class="actions"><button id="preveal" class="secondary">Zoom out / Reveal more</button><button id="pnext" class="primary">Next Photo</button></div>
</section>`;
renderGameTeamScores();
let current=null,stage=0,answered=false,wrong=0;
let deck=[];
function refillDeck(){const park=pp.value;deck=shuffle(DATA.photos.filter(x=>park==='All'||x.park===park));}
function next(){
if(!deck.length)refillDeck();
if(!deck.length){pfeed.innerHTML='<span class="bad">No photos in that filter yet.</span>';pa.innerHTML='';return;}
current=deck.pop();stage=0;answered=false;wrong=0;pf.dataset.stage='0';
pi.alt='WDW photo puzzle';
let triedFallback=false;
pi.onerror=()=>{
  if(!triedFallback && current.fallbackSrc){
    triedFallback=true;
    pi.src=current.fallbackSrc;

function jeopardy(){
const categoryNames=Object.keys(DATA.jeopardy);
let selected=[];
let boardCats=[];
let boardData={};
let score=0;
let used=new Set();
let teams=gameTeams.map(t=>({name:t.name,score:0}));
let activeTeam=activeGameTeam;

const lastJeopardyPick={};
function pickQuestionSet(cat){
  const rows=DATA.jeopardy[cat]||[];
  const values=[100,200,300,400,500];
  return values.map(v=>{
    const pool=rows.filter(x=>x.v===v);
    const key=cat+'|'+v;
    const choices=pool.length>1?pool.filter(x=>x.clue!==lastJeopardyPick[key]):pool;
    const pick=choices[Math.floor(Math.random()*choices.length)];
    if(pick)lastJeopardyPick[key]=pick.clue;
    return pick;
  }).filter(Boolean);
}

function renderPicker(){
  app.innerHTML=`<div class="scorebar"><div><div class="eyebrow">Step 2 of 2</div><h2>Choose Categories</h2></div><span class="badge" id="jcount">0 of 5 selected</span></div>
  <section class="panel">
    <div class="j-picker-head"><div><h3>Choose exactly 5 categories</h3><div class="muted">Every category supplies a $100, $200, $300, $400, and $500 clue.</div></div></div>
    <div class="j-category-grid" id="jcatgrid"></div>
    <div class="j-builder-actions">
      <button id="jbuild" class="primary" disabled>Build My Board</button>
      <button id="jrandom" class="secondary">Surprise Me</button>
      <button id="jclear" class="secondary">Clear</button>
      <button id="jbackteams" class="secondary">Back to Players</button>
    </div>
    <div class="j-builder-note">There are ${categoryNames.length} categories available. Pick a different mix whenever you start a new board.</div>
  </section>`;

  categoryNames.forEach(cat=>{
    const label=document.createElement('label');
    label.className='j-cat'+(selected.includes(cat)?' selected':'');
    label.innerHTML=`<input type="checkbox" value="${esc(cat)}" ${selected.includes(cat)?'checked':''}><strong>${esc(cat)}</strong>`;
    const box=label.querySelector('input');
    box.addEventListener('change',()=>{
      if(box.checked){
        if(selected.length>=5){box.checked=false;return;}
        selected.push(cat);
      }else{
        selected=selected.filter(x=>x!==cat);
      }
      updatePicker();
    });
    jcatgrid.appendChild(label);
  });

  function updatePicker(){
    document.querySelectorAll('.j-cat').forEach(label=>{
      const box=label.querySelector('input');
      label.classList.toggle('selected',box.checked);
      box.disabled=!box.checked && selected.length>=5;
    });
    jcount.textContent=`${selected.length} of 5 selected`;
    jbuild.disabled=selected.length!==5;
  }

  jbuild.addEventListener('click',()=>{if(selected.length===5)buildBoard()});
  jrandom.addEventListener('click',()=>{
    selected=shuffle(categoryNames).slice(0,5);
    renderPicker();
  });
  jclear.addEventListener('click',()=>{
    selected=[];
    renderPicker();
  });
  jbackteams.addEventListener('click',()=>teamSetup('jeopardy'));

  updatePicker();
}

function buildBoard(){
  boardCats=[...selected];
  boardData={};
  boardCats.forEach(cat=>boardData[cat]=pickQuestionSet(cat));
  score=0;
  teams=teams.map(t=>({name:t.name,score:0}));
  activeTeam=0;
  used=new Set();
  renderBoard();
  bumpGame('jeopardy');
}

function renderBoard(){
  const answerOptions=[...new Set(boardCats.flatMap(c=>boardData[c].map(x=>x.a)))].sort((a,b)=>a.localeCompare(b));
  app.innerHTML=`<div class="scorebar"><div><div class="eyebrow">Player Mode</div><h2>WDW Jeopardy</h2></div><div class="j-board-actions"><button id="jnew" class="secondary">Change Categories</button><button id="jchangeteams" class="secondary">Change Players</button></div></div>
  <section class="j-team-scores" id="jteamscores" aria-label="Player scores"></section>
  <div class="j-active-note" id="jactivenote"></div>
  <section class="panel jwrap"><div class="muted" style="font-size:12px;margin-bottom:8px">Tap the player that is answering, then choose a clue. On a phone, swipe the board left or right to see all 5 categories.</div><div class="jboard" id="jb"></div></section>
  <section class="card" id="jc" style="margin-top:16px"><span class="muted">Choose a dollar value to begin.</span></section>`;

  jnew.addEventListener('click',renderPicker);
  jchangeteams.addEventListener('click',()=>teamSetup('jeopardy'));

  function renderTeamScores(){
    jteamscores.innerHTML=teams.map((t,i)=>{
      const displayScore=t.score<0?'-$'+Math.abs(t.score):'$'+t.score;
      return '<button type="button" class="j-team-score '+(i===activeTeam?'active':'')+'" data-team-score="'+i+'">'+
        '<span class="j-team-name">'+esc(t.name)+'</span>'+
        '<strong>'+displayScore+'</strong>'+
      '</button>';
    }).join('');
    jactivenote.innerHTML='Answering: <strong>'+esc(teams[activeTeam].name)+'</strong> <span class="muted">• tap another player to switch</span>';
    jteamscores.querySelectorAll('[data-team-score]').forEach(btn=>{
      btn.addEventListener('click',()=>{
        activeTeam=Number(btn.dataset.teamScore);
        renderTeamScores();
      });
    });
  }

  renderTeamScores();

  boardCats.forEach(c=>{
    const h=document.createElement('div');
    h.className='jhead';
    h.textContent=c;
    jb.appendChild(h);
  });

  for(let row=0;row<5;row++)boardCats.forEach(c=>{
    const item=boardData[c][row],key=c+'|'+item.v,b=document.createElement('button');
    b.className='jcell';
    b.textContent='$'+item.v;

    b.addEventListener('click',()=>{
      if(used.has(key))return;

      jc.innerHTML=`<div class="badge">${esc(c)} • $${item.v}</div>
        <div class="question">${esc(item.clue)}</div>
        <div class="j-answer-wrap">
          <input id="ji" placeholder="Start typing an answer…" autocomplete="off" aria-label="Jeopardy answer">
          <div id="jsuggest" class="j-suggestions" role="listbox"></div>
        </div>
        <div class="muted" style="margin-top:8px;font-size:13px">Start typing and matching answers from this board will appear.</div>
        <div class="actions"><button id="jsub" class="primary">Submit</button><button id="jrev" class="secondary">Reveal</button></div>
        <div id="jf" class="feedback"></div>`;

      let activeIndex=-1;
      let currentMatches=[];

      function renderSuggestions(){
        const q=ji.value.trim().toLowerCase();
        if(!q){
          jsuggest.className='j-suggestions';
          jsuggest.innerHTML='';
          currentMatches=[];
          activeIndex=-1;
          return;
        }

        currentMatches=answerOptions.filter(a=>a.toLowerCase().includes(q)).slice(0,10);
        activeIndex=-1;

        if(!currentMatches.length){
          jsuggest.innerHTML='<div class="j-no-results">No matching answers</div>';
          jsuggest.className='j-suggestions open';
          return;
        }

        jsuggest.innerHTML=currentMatches.map((a,i)=>`<button type="button" class="j-suggestion" data-jidx="${i}">${esc(a)}</button>`).join('');
        jsuggest.className='j-suggestions open';

        jsuggest.querySelectorAll('.j-suggestion').forEach(btn=>{
          btn.addEventListener('click',()=>{
            const idx=Number(btn.dataset.jidx);
            ji.value=currentMatches[idx];
            jsuggest.className='j-suggestions';
            jsuggest.innerHTML='';
            currentMatches=[];
            activeIndex=-1;
            ji.focus();
          });
        });
      }

      function updateActive(){
        jsuggest.querySelectorAll('.j-suggestion').forEach((el,i)=>el.classList.toggle('active',i===activeIndex));
      }

      function finish(ok){
        used.add(key);
        b.classList.add('used');
        b.disabled=true;
        if(ok){
          teams[activeTeam].score+=item.v;
          record(c,true,item.v);
        }else{
          teams[activeTeam].score-=item.v;
          record(c,false,0);
        }
        if(teams.length>1)activeTeam=(activeTeam+1)%teams.length;
        renderTeamScores();
      }

      function submitAnswer(){
        if(used.has(key))return;
        const g=ji.value.trim().toLowerCase();
        const a=item.a.toLowerCase();
        const ok=g.length>2&&(a.includes(g)||g.includes(a));
        finish(ok);
        jf.innerHTML=ok?'<span class="good">Correct!</span>':`<span class="bad">Not quite.</span> Answer: ${esc(item.a)}`;
        jsub.disabled=jrev.disabled=true;
        ji.disabled=true;
        jsuggest.className='j-suggestions';
      }

      ji.addEventListener('input',renderSuggestions);
      ji.addEventListener('keydown',e=>{
        if(jsuggest.classList.contains('open')&&currentMatches.length){
          if(e.key==='ArrowDown'){e.preventDefault();activeIndex=(activeIndex+1)%currentMatches.length;updateActive();return;}
          if(e.key==='ArrowUp'){e.preventDefault();activeIndex=(activeIndex-1+currentMatches.length)%currentMatches.length;updateActive();return;}
          if(e.key==='Enter'&&activeIndex>=0){
            e.preventDefault();
            ji.value=currentMatches[activeIndex];
            jsuggest.className='j-suggestions';
            jsuggest.innerHTML='';
            currentMatches=[];
            activeIndex=-1;
            return;
          }
        }
        if(e.key==='Enter'){e.preventDefault();submitAnswer();}
        if(e.key==='Escape'){jsuggest.className='j-suggestions';}
      });

      jsub.addEventListener('click',submitAnswer);
      jrev.addEventListener('click',()=>{
        if(used.has(key))return;
        finish(false);
        jf.innerHTML=`Answer: <span class="gold">${esc(item.a)}</span>`;
        jsub.disabled=jrev.disabled=true;
        ji.disabled=true;
        jsuggest.className='j-suggestions';
      });

      setTimeout(()=>ji.focus(),0);
    });

    jb.appendChild(b);
  });
}

renderPicker();
}
