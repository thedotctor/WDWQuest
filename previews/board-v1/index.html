// Original layered game effects, played automatically after the first interaction.
let gameAudio=null,gameAudioBus=null,gameAudioNoise=null,gameAudioRoom=null;
function unlockGameAudio(){
 try{
   const AudioEngine=window.AudioContext||window.webkitAudioContext;
   if(!AudioEngine)return null;
   if(!gameAudio||gameAudio.state==='closed'){
     gameAudio=new AudioEngine();
     const volume=gameAudio.createGain();volume.gain.value=.30;
     const limiter=gameAudio.createDynamicsCompressor();
     limiter.threshold.value=-18;limiter.knee.value=16;limiter.ratio.value=6;
     limiter.attack.value=.003;limiter.release.value=.18;
     volume.connect(limiter);limiter.connect(gameAudio.destination);gameAudioBus=volume;
     // A quiet, short room reflection gives chimes body without washing out taps.
     const room=gameAudio.createDelay(.5),damping=gameAudio.createBiquadFilter(),wet=gameAudio.createGain();
     room.delayTime.value=.105;damping.type='lowpass';damping.frequency.value=3400;wet.gain.value=.13;
     room.connect(damping);damping.connect(wet);wet.connect(volume);gameAudioRoom=room;
     gameAudioNoise=gameAudio.createBuffer(1,gameAudio.sampleRate*2,gameAudio.sampleRate);
     const data=gameAudioNoise.getChannelData(0);
     for(let i=0;i<data.length;i++)data[i]=Math.random()*2-1;
   }
   if(gameAudio.state!=='running'){
     const resumed=gameAudio.resume();
     if(resumed&&resumed.catch)resumed.catch(function(){});
   }
   return gameAudio;
 }catch(audioError){return null}
}
document.addEventListener('pointerdown',unlockGameAudio,{capture:true,passive:true});
document.addEventListener('touchend',unlockGameAudio,{capture:true,passive:true});
document.addEventListener('click',unlockGameAudio,{capture:true,passive:true});
document.addEventListener('keydown',function(e){if(e.key==='Enter'||e.key===' ')unlockGameAudio()},{capture:true});

const transportationBuffers={};
function prepareTransportationRecording(vehicle){
 const audio=unlockGameAudio();
 if(!audio)return Promise.resolve(null);
 const encoded=window.WDW_TRANSPORT_RECORDINGS&&window.WDW_TRANSPORT_RECORDINGS[vehicle];
 if(!encoded)return Promise.resolve(null);
 if(!transportationBuffers[vehicle]){
   const raw=atob(encoded),bytes=new Uint8Array(raw.length);
   for(let i=0;i<raw.length;i++)bytes[i]=raw.charCodeAt(i);
   transportationBuffers[vehicle]=audio.decodeAudioData(bytes.buffer).catch(function(error){
     delete transportationBuffers[vehicle];console.warn('Transportation recording could not load:',vehicle,error);return null;
   });
 }
 return transportationBuffers[vehicle];
}
// Decode recordings during the initial interaction, ready for later landings.
document.addEventListener('pointerdown',function(){
 ['monorail','bus','skyliner','boat'].forEach(prepareTransportationRecording);
},{once:true,passive:true});
function playTransportationSound(vehicle,durationMs,buffer){
 const audio=gameAudio;
 if(!buffer||!audio||audio.state!=='running'||document.hidden)return;
 try{
   const duration=Math.min(durationMs/1000,buffer.duration),start=audio.currentTime;
   const source=audio.createBufferSource(),gain=audio.createGain();
   source.buffer=buffer;
   let pan=null;
   source.connect(gain);
   if(audio.createStereoPanner){
     pan=audio.createStereoPanner();gain.connect(pan);pan.connect(gameAudioBus);
     pan.pan.setValueAtTime(-.75,start);pan.pan.linearRampToValueAtTime(.75,start+duration);
   }else gain.connect(gameAudioBus);
   // Approach, pass the center, and recede together with the vehicle.
   // Recordings run at their original pitch and speed, without time stretching.
   [[0,.0001],[.22,1.3],[.45,2],[.60,2],[.82,1],[1,.0001]].forEach(function(point,i){
     const time=start+duration*point[0];
     if(i===0)gain.gain.setValueAtTime(point[1],time);
     else gain.gain.linearRampToValueAtTime(point[1],time);
   });
   source.onended=function(){source.disconnect();gain.disconnect();if(pan)pan.disconnect()};
   source.start(start);source.stop(start+duration);
 }catch(error){console.warn('Transportation playback failed:',vehicle,error)}
}

function playGameSound(effect){
 try{
   if(!gameAudio||gameAudio.state!=='running'||document.hidden)return;
   const audio=gameAudio,bus=gameAudioBus,now=audio.currentTime+.012;
   function tone(frequency,delay,duration,level,type,endFrequency,room){
     const oscillator=audio.createOscillator(),gain=audio.createGain(),start=now+delay;
     oscillator.type=type||'sine';oscillator.frequency.setValueAtTime(frequency,start);
     if(endFrequency)oscillator.frequency.exponentialRampToValueAtTime(endFrequency,start+duration);
     gain.gain.setValueAtTime(.0001,start);
     gain.gain.exponentialRampToValueAtTime(Math.max(.0002,level),start+Math.min(.012,duration*.2));
     gain.gain.exponentialRampToValueAtTime(.0001,start+duration);
     oscillator.connect(gain);gain.connect(bus);
     if(room)gain.connect(gameAudioRoom);
     oscillator.onended=function(){oscillator.disconnect();gain.disconnect()};
     oscillator.start(start);oscillator.stop(start+duration+.025);
   }
   function noise(delay,duration,level,frequency,kind,endFrequency){
     const source=audio.createBufferSource(),filter=audio.createBiquadFilter(),gain=audio.createGain(),start=now+delay;
     source.buffer=gameAudioNoise;source.loop=true;
     filter.type=kind||'lowpass';filter.Q.value=.7;filter.frequency.setValueAtTime(frequency||1400,start);
     if(endFrequency)filter.frequency.exponentialRampToValueAtTime(endFrequency,start+duration);
     gain.gain.setValueAtTime(.0001,start);gain.gain.exponentialRampToValueAtTime(level,start+.005);
     gain.gain.exponentialRampToValueAtTime(.0001,start+duration);
     source.connect(filter);filter.connect(gain);gain.connect(bus);
     source.onended=function(){source.disconnect();filter.disconnect();gain.disconnect()};
     source.start(start,Math.random());source.stop(start+duration+.025);
   }
   function bell(note,delay,duration,level){
     tone(note,delay,duration,level,'sine',null,true);
     tone(note*2.01,delay,duration*.5,level*.28,'sine',null,true);
     tone(note*3.97,delay,duration*.24,level*.10,'sine',null,true);
   }
   function mallet(note,delay,level){
     tone(note,delay,.19,level,'sine');
     tone(note*2.76,delay,.07,level*.24,'sine');
     noise(delay,.018,level*.16,1800,'bandpass');
   }
   function melody(notes,spacing,duration,level,delay){
     notes.forEach(function(note,i){bell(note,(delay||0)+i*spacing,duration,level)});
   }
   switch(effect){
     case 'dice':
       for(let i=0;i<14;i++){
         const delay=i*.055+i*i*.0015;
         noise(delay,.025+i*.001,.14,1400+Math.random()*1800,'bandpass');
         mallet(350+Math.random()*330,delay,.10);
       }
       noise(1.02,.10,.22,850,'lowpass');mallet(185,1.02,.18);mallet(260,1.065,.12);break;
     case 'move':
       mallet(410+Math.random()*35,0,.13);tone(145,0,.055,.06,'sine',100);break;
     case 'correct':
       melody([659.25,783.99,1046.5],.105,.55,.18);
       bell(1318.51,.34,.72,.12);tone(261.63,.2,.45,.07,'triangle',null,true);break;
     case 'wrong':
       tone(311.13,0,.28,.13,'triangle',233.08);tone(233.08,.18,.40,.12,'triangle',155.56);
       tone(155.56,.18,.38,.07,'sine');break;
     case 'pixie':
       melody([1318.51,1567.98,2093,2637.02,3135.96,2093,2637.02],.075,.65,.095);
       noise(0,.55,.045,5500,'highpass',1200);bell(1046.5,.16,.85,.11);break;
     case 'snack':
       noise(0,.09,.095,2400,'bandpass');noise(.10,.055,.055,3300,'highpass');
       [523.25,659.25,783.99,1046.5].forEach(function(note,i){mallet(note,.16+i*.115,.17)});
       bell(1318.51,.65,.5,.085);break;
     case 'card':
       noise(0,.15,.17,1200,'bandpass',4500);noise(.16,.13,.13,3800,'highpass',1200);
       noise(.34,.04,.16,1600,'bandpass');bell(880,.40,.45,.10);bell(1174.66,.48,.55,.09);break;
     case 'pin':
       mallet(1650,0,.10);mallet(2200,.08,.08);
       melody([783.99,1046.5,1318.51,1567.98],.12,.60,.14,.16);
       bell(2093,.70,.85,.085);break;
     case 'autograph':
       for(let i=0;i<8;i++)noise(i*.06,.035,.045,2200+i%3*900,'bandpass');
       noise(.49,.08,.08,1200,'bandpass',3800);
       melody([659.25,987.77,1318.51],.13,.65,.14,.56);bell(1567.98,.98,.75,.09);break;
     case 'security':
       noise(0,.035,.13,900,'bandpass');tone(110,0,.09,.12,'sine',65);
       for(let i=0;i<2;i++){
         tone(587.33,.16+i*.48,.27,.095,'sine',783.99);
         tone(783.99,.40+i*.48,.22,.075,'sine',587.33);
       }
       mallet(220,1.18,.10);break;
     case 'doubles':
       // A bright invitation to the pin shop, rather than an explosive bang.
       melody([523.25,659.25,783.99,1046.5],.085,.48,.13);
       bell(1318.51,.36,.75,.13);bell(1567.98,.43,.75,.08);break;
     case 'fireworks':
       for(let i=0;i<4;i++){
         const delay=i*.64;
         noise(delay,.28,.075,650,'bandpass',4200);
         tone(340,delay,.25,.045,'sine',1500);
         noise(delay+.28,.65,.28,2400,'lowpass',250);
         tone(75,delay+.28,.48,.18,'sine',30);
         for(let j=0;j<7;j++)noise(delay+.37+j*.045,.045,.065,4500,'highpass');
       }
       break;
     case 'victory':
       [523.25,659.25,783.99].forEach(function(note){bell(note,0,.85,.075)});
       melody([523.25,659.25,783.99,1046.5,987.77,1046.5,1318.51],.19,.65,.16,.18);
       [261.63,329.63,392,523.25].forEach(function(note){tone(note,1.75,1.35,.055,'triangle',null,true)});
       [1046.5,1318.51,1567.98].forEach(function(note,i){bell(note,1.75+i*.075,1.30,.10)});
       break;
   }
 }catch(audioError){
   // Audio failure must never interrupt gameplay.
 }
}

function positionSnackNameMask(snack,photo){
 if(!snack.mask||!photo||!photo.naturalWidth||!photo.naturalHeight)return;
 const mask=document.getElementById('snackNameMask');
 const frame=document.getElementById('snackPicture');
 if(!mask||!frame)return;
 const fw=frame.clientWidth,fh=frame.clientHeight;
 const scale=Math.max(fw/photo.naturalWidth,fh/photo.naturalHeight);
 const rw=photo.naturalWidth*scale,rh=photo.naturalHeight*scale;
 const ox=(fw-rw)/2,oy=(fh-rh)/2;

function refillSnackDeck(){
 snackDeck=shuffle(SNACK_BREAKS.map(function(s,i){return i}));
}
function pickSnackBreak(){
 if(!snackDeck.length)refillSnackDeck();
 if(lastSnackName&&snackDeck.length>1&&SNACK_BREAKS[snackDeck[snackDeck.length-1]].name===lastSnackName){
   const alt=snackDeck.findIndex(function(i){return SNACK_BREAKS[i].name!==lastSnackName});
   if(alt>=0){
     const last=snackDeck.length-1;
     const tmp=snackDeck[alt];snackDeck[alt]=snackDeck[last];snackDeck[last]=tmp;
   }
 }
 const snack=SNACK_BREAKS[snackDeck.pop()];
 lastSnackName=snack.name;
 return snack;
}
function snackChoices(snack){
 const names=[];
 shuffle(SNACK_BREAKS.slice()).forEach(function(s){
   if(s.name!==snack.name&&names.indexOf(s.name)<0&&names.length<3)names.push(s.name);
 });
 return shuffle([snack.name].concat(names));
}

 };

 snackChoices(snack).forEach(function(choice){
   const b=document.createElement('button');
   b.className='answer';

 });
}
async function gradeSnackBreak(choice,snack,btn,bypassRetry){
 if(btn.disabled&&!bypassRetry)return;
 const player=players[currentPlayer];
 if(choice!==snack.name&&!bypassRetry&&powerReady(player,'food-pretzel')){
   document.querySelectorAll('#snackAnswers .answer').forEach(function(b){b.disabled=true});
   const use=await choosePinAbility(player,'food-pretzel','You missed this Snack Break. Use your pin for a fresh Snack Break question?',[{label:'Use Ability',value:true},{label:'Skip',value:false}]);
   if(use){usePower('food-pretzel');askSnackBreak(player.pos);return}
   return gradeSnackBreak(choice,snack,btn,true);
 }
 const buttons=Array.from(document.querySelectorAll('#snackAnswers .answer'));
 const ok=choice===snack.name;
 playGameSound(ok?'correct':'wrong');
 buttons.forEach(function(b){b.disabled=true;if(b.textContent===snack.name)b.classList.add('correct')});
 if(!ok)btn.classList.add('wrong');
 const p=players[currentPlayer];
 const result=document.getElementById('snackResult');
 const actions=document.getElementById('snackActions');
 if(ok){
   const reward=50+(ownsPower(p,'food-dole')?10:0);
   p.cash+=reward;
   renderScores();
   result.innerHTML='<span class="good">Correct!</span> That is '+esc(snack.name)+'. You earned <strong>$'+reward+'</strong>!';
 }else{
   result.innerHTML='<span class="bad">Not quite.</span> That was <strong>'+esc(snack.name)+'</strong>.';
 }
 actions.innerHTML='<button class="primary" id="snackContinue">Continue</button>';
 document.getElementById('snackContinue').addEventListener('click',function(){
   closeModal();
   const msg=ok?p.name+' identified '+snack.name+' and earned $'+(50+(ownsPower(p,'food-dole')?10:0))+'.':p.name+' missed the Snack Break. The answer was '+snack.name+'.';
   if(ok)finishCorrectAnswer(msg);else finishTurn(msg);
 });
}

function boardRect(i){
 const board=document.getElementById('board');
 const previousOuter=Math.min(1557,(window.innerWidth-(window.innerWidth<=760?20:184))*.9);
 const corner=(7*1.10*1.22*1.25)*(previousOuter-6)/board.clientWidth;
 const along=(100-2*corner)/19,depth=corner;
 const side=Math.floor(i/20),step=i%20;
 const cornerSize=corner;
 if(step===0){
   return {top:side<2?0:100-cornerSize,left:side===0||side===3?0:100-cornerSize,width:cornerSize,height:cornerSize,side:['top','right','bottom','left'][side]};
 }
 const offset=corner+(step-1)*along;
 if(side===0)return {top:0,left:offset,width:along,height:depth,side:'top'};
 if(side===1)return {top:offset,left:100-depth,width:depth,height:along,side:'right'};
 if(side===2)return {top:100-depth,left:100-offset-along,width:along,height:depth,side:'bottom'};
 return {top:100-offset-along,left:0,width:depth,height:along,side:'left'};
}

function resizeFinaleFireworks(){

function burstFinaleFirework(x,y,count){
 const colors=['#ffd166','#ff5d8f','#7bdff2','#b8f2e6','#cdb4db','#ffffff','#ffadad','#f4d35e'];
 const total=count||54;
 for(let i=0;i<total;i++){
   const angle=((Math.PI*2)/total)*i+(Math.random()*.18);
   const speed=2.6+Math.random()*5.2;
   finaleFireworksParticles.push({
     x:x,y:y,
     vx:Math.cos(angle)*speed,
     vy:Math.sin(angle)*speed,
     life:58+Math.random()*28,
     maxLife:86,
     size:1.8+Math.random()*2.6,
     color:colors[Math.floor(Math.random()*colors.length)]
   });
 }
}
function launchFinaleFirework(){
 const w=window.innerWidth,h=window.innerHeight;
 burstFinaleFirework(
   w*(.1+Math.random()*.8),
   h*(.10+Math.random()*.48),
   44+Math.floor(Math.random()*24)
 );
}
function drawFinaleFireworks(){
 finaleFireworksCtx.clearRect(0,0,window.innerWidth,window.innerHeight);
 for(let i=finaleFireworksParticles.length-1;i>=0;i--){
   const p=finaleFireworksParticles[i];
   p.x+=p.vx;p.y+=p.vy;p.vy+=.038;p.vx*=.994;p.life-=1;
   const alpha=Math.max(0,p.life/p.maxLife);
   finaleFireworksCtx.globalAlpha=alpha;
   finaleFireworksCtx.shadowBlur=10;
   finaleFireworksCtx.shadowColor=p.color;
   finaleFireworksCtx.fillStyle=p.color;
   finaleFireworksCtx.beginPath();
   finaleFireworksCtx.arc(p.x,p.y,p.size,0,Math.PI*2);
   finaleFireworksCtx.fill();
   if(p.life<=0)finaleFireworksParticles.splice(i,1);
 }
 finaleFireworksCtx.globalAlpha=1;
 finaleFireworksCtx.shadowBlur=0;
 if(finaleFireworksRunning||finaleFireworksParticles.length){
   finaleFireworksFrame=requestAnimationFrame(drawFinaleFireworks);
 }else{
   finaleFireworksCtx.clearRect(0,0,window.innerWidth,window.innerHeight);
 }
}
function stopFinaleFireworks(){
 finaleFireworksRunning=false;
 clearInterval(finaleFireworksBurstTimer);

 finaleFireworksParticles=[];

function finaleProgress(playerIndex){

 if(!p)return {missingBadges:BADGES.slice(),parks:[],qualifyingPark:null,bestPark:null,ready:false};
 const missingBadges=BADGES.filter(function(badge){return !(p.badges||[]).includes(badge)});
 const parks=[...new Set(PIN_DESIGNS.filter(function(pin){return !pin.optional}).map(function(pin){return pin.park}))].map(function(park){
   const propertyIndices=[];
   SPACES.forEach(function(space,i){if(space.type==='property'&&space.park===park)propertyIndices.push(i)});
   const pins=PIN_DESIGNS.filter(function(pin){return pin.park===park});
   const propertiesOwned=propertyIndices.filter(function(i){return owners[i]===playerIndex}).length;
   const pinsOwned=pins.filter(function(pin){return (p.pins||[]).includes(pin.id)}).length;
   return {park:park,propertiesOwned:propertiesOwned,propertiesTotal:propertyIndices.length,pinsOwned:pinsOwned,pinsTotal:pins.length,
     complete:propertyIndices.length>0&&pins.length>0&&propertiesOwned===propertyIndices.length&&pinsOwned===pins.length};
 });
 const qualifyingPark=parks.find(function(park){return park.complete})||null;
 const bestPark=parks.slice().sort(function(a,b){
   return (b.propertiesOwned/b.propertiesTotal+b.pinsOwned/b.pinsTotal)-(a.propertiesOwned/a.propertiesTotal+a.pinsOwned/a.pinsTotal);
 })[0]||null;
 return {missingBadges:missingBadges,parks:parks,qualifyingPark:qualifyingPark,bestPark:bestPark,ready:missingBadges.length===0&&!!qualifyingPark&&!(p.finaleLapRemaining>0)};
}

async function animatePixieDust(){
 let canvas=null,frame=0;
 try{
   canvas=document.createElement('canvas');
   canvas.className='pixie-dust-canvas';canvas.setAttribute('aria-hidden','true');
   const ctx=canvas.getContext('2d');if(!ctx)return;
   const w=window.innerWidth,h=window.innerHeight,dpr=Math.min(window.devicePixelRatio||1,2);
   canvas.width=Math.round(w*dpr);canvas.height=Math.round(h*dpr);
   ctx.setTransform(dpr,0,0,dpr,0,0);document.body.appendChild(canvas);
   const gentle=reducedMotion(),duration=gentle?750:3200;
   const particles=Array.from({length:gentle?45:160},function(_,i){
     return {x:Math.random()*w,y:Math.random()*h,size:i%3===0?6+Math.random()*8:2+Math.random()*3,
       phase:Math.random()*Math.PI*2,speed:25+Math.random()*40,color:['#fff9d5','#fde68a','#facc15','#b4f5cf'][i%4],star:i%3===0};
   });
   const began=performance.now();
   function draw(now){
     const elapsed=Math.max(0,now-began)/1000,progress=Math.min(1,elapsed/(duration/1000));
     ctx.clearRect(0,0,w,h);
     const fade=gentle?1:Math.min(1,(1-progress)*4);
     particles.forEach(function(p){
       const x=p.x+(gentle?0:Math.sin(elapsed*2+p.phase)*32);
       const y=gentle?p.y:(p.y-elapsed*p.speed+h+100)%(h+100)-30;
       const twinkle=gentle?.7:.5+.5*Math.pow(Math.sin(elapsed*5+p.phase),2);
       ctx.save();ctx.translate(x,y);ctx.globalAlpha=twinkle*fade;ctx.fillStyle=p.color;
       ctx.shadowColor=p.color;ctx.shadowBlur=p.star?16:10;
       ctx.beginPath();
       if(p.star){
         ctx.rotate(gentle?0:elapsed*.7+p.phase);
         for(let j=0;j<8;j++){const a=j*Math.PI/4,r=j%2?p.size*.23:p.size;if(j===0)ctx.moveTo(Math.cos(a)*r,Math.sin(a)*r);else ctx.lineTo(Math.cos(a)*r,Math.sin(a)*r)}
         ctx.closePath();
       }else ctx.arc(0,0,p.size,0,Math.PI*2);
       ctx.fill();ctx.restore();
     });
     if(!gentle&&progress<1)frame=requestAnimationFrame(draw);
   }
   draw(began);
   await wait(duration);
 }catch(animationError){
   // Decoration must never block the Pixie Dust question.
 }finally{
   cancelAnimationFrame(frame);
   if(canvas)canvas.remove();
 }
}

function refillQuestionDeck(badge){
 const indices=[];
 QUESTION_BANK.forEach(function(q,i){if(q.badge===badge)indices.push(i)});
 const deck=shuffle(indices);
 const previous=lastQuestionsByBadge[badge];
 if(deck.length>1&&deck[deck.length-1]===previous){
   const first=deck[0];deck[0]=deck[deck.length-1];deck[deck.length-1]=first;
 }
 questionDecks[badge]=deck;
 return deck;
}
function resetMagicDeck(){
 magicDeck=shuffle(MAGIC_CARDS.map(function(c,i){return i}));
 lastMagicCardId=null;lastMagicCard=null;
}
function drawMagicCard(){
 if(!magicDeck.length){
   magicDeck=shuffle(MAGIC_CARDS.map(function(c,i){return i}));
   if(magicDeck.length>1&&MAGIC_CARDS[magicDeck[magicDeck.length-1]].id===lastMagicCardId){
     const first=magicDeck[0];magicDeck[0]=magicDeck[magicDeck.length-1];magicDeck[magicDeck.length-1]=first;
   }
 }
 playGameSound('card');
 const card=MAGIC_CARDS[magicDeck.pop()];
 lastMagicCardId=card.id;lastMagicCard=card;
 renderMagicPile();
 return card;
}

function applyMagicInstantEffect(card,playerIndex){
 const p=players[playerIndex];
 const others=players.filter(function(other,i){return i!==playerIndex&&!other.eliminated});
 let amount=0;
 if(card.effect==='cash'){p.cash+=card.amount;return p.name+(card.amount>=0?' collected $':' paid $')+Math.abs(card.amount)+'.'}
 if(card.effect==='rentPass'){p.rentPasses=(p.rentPasses||0)+1;return p.name+' received a Magic Rent Pass for the next rent payment.'}
 if(card.effect==='propertyBonus'){amount=Math.max(20,Math.min(100,p.props.length*20));p.cash+=amount;return p.name+' collected a $'+amount+' Park Partner Bonus.'}
 if(card.effect==='maintenance'){amount=Math.max(10,Math.min(75,p.props.length*10));p.cash-=amount;return p.name+' paid $'+amount+' in maintenance.'}
 if(card.effect==='collectPlayers'){
   if(!others.length){p.cash+=50;return p.name+' collected $50 from the bank.'}
   others.forEach(function(other){other.cash-=25;p.cash+=25});
   return p.name+' collected $25 from each other active player ($'+(others.length*25)+' total).';
 }
 if(card.effect==='payPlayers'){
   if(!others.length){p.cash-=25;return p.name+' paid $25 to the bank.'}
   others.forEach(function(other){other.cash+=25;p.cash-=25});
   return p.name+' paid $25 to each other active player ($'+(others.length*25)+' total).';
 }
 if(card.effect==='richestGift'){
   let richest=-1;
   players.forEach(function(other,i){if(i!==playerIndex&&!other.eliminated&&(richest<0||other.cash>players[richest].cash))richest=i});
   p.cash+=50;
   if(richest<0)return p.name+' received $50 from the bank.';
   players[richest].cash-=50;
   return players[richest].name+' gave '+p.name+' $50.';
 }
 throw new Error('Unknown Magic & Mischief effect: '+card.effect);
}
function magicTravelDistance(card,from){
 if(card.effect==='move')return card.steps;
 for(let steps=1;steps<=SPACES.length;steps++){
   const s=SPACES[(from+steps)%SPACES.length];
   if((card.target==='transport'&&s.type==='transport')||(card.target==='show'&&s.show)||(card.target==='snack'&&s.name==='Snack Break'))return steps;
 }
 return 0;
}
async function applyMagicCard(card){
 const p=players[currentPlayer];
 if(card.effect==='pin'){
   showPinReward(currentPlayer,function(){finishTurn(p.name+' drew '+card.title+'.')});return;
 }
 if(card.effect==='autograph'){
   showAutographEncounter(currentPlayer,function(){finishTurn(p.name+' drew '+card.title+'.')});
   return;
 }
 if(card.effect==='security'){
   if(powerReady(p,'resort-wilderness')){
     const avoid=await choosePinAbility(p,'resort-wilderness','Use this once-per-game power to avoid Park Security?',[{label:'Use Ability',value:true},{label:'Go to Security',value:false}]);
     if(avoid){usePower('resort-wilderness');finishTurn(p.name+' used Wilderness Lodge to avoid Park Security.');return}
   }
   playGameSound('security');
   await animateSecurityEscort(currentPlayer);
   p.inSecurity=true;p.skipTurns=1;notePawnArrival(p);
   movingPlayer=currentPlayer;renderAll();
   const spot=document.getElementById('securitySpot');
   if(spot)spot.scrollIntoView({behavior:reducedMotion()?'auto':'smooth',block:'center',inline:'center'});
   setStatus(esc(p.name)+' goes to <strong>Park Security</strong> and will miss the next turn.');
   if(!reducedMotion())await wait(900);
   movingPlayer=-1;
   finishTurn(p.name+' drew '+card.title+'. Sent to Security: miss the next turn. No lap bonus.');
   return;
 }
 if(card.effect==='move'||card.effect==='destination'){
   const steps=magicTravelDistance(card,p.pos);
   addLog(p.name+' drew '+card.title+'. '+card.text);
   if(!steps){finishTurn(p.name+' stayed in place.');return}
   await movePlayerSpaces(steps,steps<0?'moves backward':'travels with Magic & Mischief');
   renderScores();
   setStatus(esc(p.name)+' reached <strong>'+esc(SPACES[p.pos].name)+'</strong>.');
   await pauseAfterLanding(p.pos);
   await resolveSpace(p.pos,false);
   return;
 }
 const message=applyMagicInstantEffect(card,currentPlayer);
 finishTurn(p.name+' drew '+card.title+'. '+message);
}

function pickQuestion(badge,finalMode){
 const categories=Array.from(new Set(QUESTION_BANK.map(function(q){return q.badge})));
 categories.forEach(function(category){if(!questionDecks[category])refillQuestionDeck(category)});
 if(!categories.includes(badge)){
   let available=categories.filter(function(category){return questionDecks[category].length>0});
   if(!available.length){categories.forEach(refillQuestionDeck);available=categories.slice()}
   if(finalMode){
     const withChallenges=available.filter(function(category){return questionDecks[category].some(function(i){return QUESTION_BANK[i].diff==='Challenge'})});
     if(withChallenges.length)available=withChallenges;
   }
   badge=available[Math.floor(Math.random()*available.length)];
 }
 const deck=questionDecks[badge].length?questionDecks[badge]:refillQuestionDeck(badge);
 let position=deck.length-1;
 if(finalMode){
   const challenge=deck.findIndex(function(i){return QUESTION_BANK[i].diff==='Challenge'&&i!==lastQuestionsByBadge[badge]});
   if(challenge>=0)position=challenge;
 }
 const index=deck.splice(position,1)[0];
 lastQuestion=index;lastQuestionsByBadge[badge]=index;
 return QUESTION_BANK[index];
}
function landedSpotMarkup(spaceIndex,questionBadge){

   kind=isShowSpace(s)?'Nighttime Show':'Attraction';
   details.push(s.badge||questionBadge||'Trivia');
   details.push('Buy $'+s.cost);
   if(isShowSpace(s)){
     if(owners[spaceIndex]===undefined)details.push('Show rent $25 → $200');
     else details.push('Rent $'+rentForSpace(spaceIndex)+' • Shows '+showSpacesOwned(owners[spaceIndex])+'/4');
   }else details.push('Rent $'+s.rent);
   details.push(owners[spaceIndex]===undefined?'Unowned':'Owned by '+players[owners[spaceIndex]].name);
 }else if(s.type==='trivia'){
   kind=s.badge==='Disney History'?'History Challenge':'Trivia Challenge';
   details.push(s.badge||questionBadge||'Random category');
 }else if(s.type==='final'){
   kind='Final Challenge';
   details.push('6 badges + all properties and pins in the same park');
 }else if(s.type==='transport'){
   kind='Transportation Corner';
   details.push('Optional bonus reroll');
 }else if(s.type==='pin'){
   kind='Pin Traders';details.push('Optional trade with a Cast Member or another player');
 }else if(s.type==='magic'){
   kind='Magic & Mischief';
   details.push('Draw 1 card from the shared 45-card pile');
 }else if(s.type==='special'){
   kind='Special Space';
   if(s.name==='Snack Break'){
     details.push('Guess the pictured snack');
     details.push('Correct: +$'+(s.reward||50));
   }else{
     details.push('Correct: +$'+(s.name==='Pixie Dust'?10:Math.abs(s.amount||100)));
     details.push(s.name==='Pixie Dust'?'Wrong: no money lost':'Wrong: -$'+Math.abs(s.amount||100));

 }else if(s.type==='start'){

 return '<div class="landed-card">'+
   '<div class="landed-icon">'+s.icon+'</div>'+
   '<div><div class="landed-kicker">You landed on • '+esc(kind)+'</div>'+

}
function askQuestion(badge,ctx){
 const p=players[currentPlayer];
 if(ctx.mode==='final'&&!finaleProgress(currentPlayer).ready){finishTurn(p.name+' still needs all 6 badges and every property and pin from the same park.');return}
 const landedSpace=SPACES[ctx.space===undefined?p.pos:ctx.space];
 // Attraction purchases and park trivia always use the landed space's park.
 // Pin retries pass through this same routing so they cannot change parks.
 if(ctx.mode==='property'||ctx.mode==='badge'&&landedSpace&&landedSpace.type==='trivia'){
   badge=landedSpace.park||landedSpace.badge;
 }else if(ctx.mode==='badge'&&!badge){
   const missing=BADGES.filter(function(b){return p.badges.indexOf(b)<0});
   if(missing.length)badge=missing[Math.floor(Math.random()*missing.length)];
 }
 const q=pickQuestion(badge,ctx.mode==='final');
 const landedInfo=ctx.mode==='final'?'<div class="landed-card"><div class="landed-icon">🏰</div><div><div class="landed-kicker">Center Space • Final Challenge</div><div class="landed-name">Cinderella Castle Finale</div><div class="landed-details"><span class="landed-detail">All 6 badges collected</span><span class="landed-detail">'+esc(finaleProgress(currentPlayer).qualifyingPark.park)+' properties and pins complete</span><span class="landed-detail">Correct answer wins</span></div></div></div>':landedSpotMarkup(p.pos,q.badge);
 modalRoot.innerHTML='<div class="modal-backdrop"><div class="modal"><div class="badge">'+esc(ctx.mode==='final'?'FINAL CHALLENGE':q.badge)+'</div>'+landedInfo+'<h2>'+(ctx.mode==='property'?'Answer Correctly to Buy It':'Trivia Challenge')+'</h2><div class="question">'+esc(q.q)+'</div><div class="answers" id="qAnswers"></div><div class="result" id="qResult"></div><div class="actions" id="qActions"></div></div></div>';
 const answers=document.getElementById('qAnswers');
 shuffle(q.choices).forEach(function(choice){
   const b=document.createElement('button');b.className='answer';b.textContent=choice;
   b.addEventListener('click',function(){gradeQuestion(choice,q,ctx,b)});
   answers.appendChild(b);
 });
}
function applySpecialSpace(spaceIndex,correct){
 const s=SPACES[spaceIndex],p=players[currentPlayer];
 if(!s||s.type!=='special'||s.name==='Snack Break')return '';
 const amount=s.name==='Pixie Dust'?(correct?10+(ownsPower(p,'food-churro')?5:0):0):Math.abs(s.amount||100);
 if(correct){
   p.cash+=amount;
   renderScores();
   return p.name+' answered correctly at '+s.name+' and gained $'+amount+'.';
 }
 p.cash-=amount;
 renderScores();
 return p.name+' answered incorrectly at '+s.name+(amount?' and lost $'+amount+'.':'. No money lost.');
}
async function gradeQuestion(choice,q,ctx,btn,bypassRetry){
 if(btn.disabled&&!bypassRetry)return;
 const player=players[currentPlayer];
 if(choice!==q.a&&ctx.mode!=='final'&&!bypassRetry&&powerReady(player,'food-icecream')){
   document.querySelectorAll('#qAnswers .answer').forEach(function(b){b.disabled=true});
   const use=await choosePinAbility(player,'food-icecream','You missed this trivia question. Use your pin for a fresh question in the same category?',[{label:'Use Ability',value:true},{label:'Skip',value:false}]);
   if(use){usePower('food-icecream');askQuestion(q.badge,ctx);return}
   return gradeQuestion(choice,q,ctx,btn,true);
 }
 if(ctx.mode==='final'&&!finaleProgress(currentPlayer).ready){closeModal();finishTurn(players[currentPlayer].name+' no longer meets the Castle Finale requirements.');return}
 const buttons=Array.from(document.querySelectorAll('#qAnswers .answer'));buttons.forEach(function(b){b.disabled=true;if(b.textContent===q.a)b.classList.add('correct')});
 const ok=choice===q.a;if(!ok)btn.classList.add('wrong');
 playGameSound(ok?'correct':'wrong');
 const result=document.getElementById('qResult'),actions=document.getElementById('qActions');
 const p=players[currentPlayer];
 if(!ok){
   result.innerHTML='<span class="bad">Not quite.</span> Answer: '+esc(q.a);
   if(ctx.mode==='final'){
     p.finaleLapRemaining=SPACES.length;
     result.innerHTML+='<br>Complete another full lap ('+SPACES.length+' spaces forward) before trying the Castle Finale again. Backward movement does not count toward your lap.';
     renderFinale();
   }
   if(ctx.mode==='special'){
     const special=SPACES[ctx.space];
     result.innerHTML+='<br>'+esc(special.name==='Pixie Dust'?'No money lost for an incorrect answer.':special.name+' takes $'+Math.abs(special.amount||100)+' for an incorrect answer.');
   }

function advanceTurn(msg){

   currentPlayer=(currentPlayer+1)%players.length;
   if(currentPlayer===0)pinRound++;
   const next=players[currentPlayer];
   if(next.eliminated)continue;
   if(next.skipTurns>0){
     next.skipTurns--;
     const skipped=next.name+' missed a turn at Park Security. Return to the previous space on the next roll.';
     addLog(skipped);messages.push(skipped);
     continue;
   }
   break;
 }
 players[currentPlayer].pinTradesThisTurn=0;
 turnLocked=false;movingPlayer=-1;
 renderAll();

e their last autograph. Three Magic &amp; Mischief cards guarantee an autograph. Collect all 50; each new visit chooses a missing character first. After completing your book, repeat character visits are still possible. Open your book from your player card. Autographs are optional.</p><p>The board has <strong>80 spaces</strong> (19 park spaces on each side, plus four transportation corners). Each side is themed to one park: Magic Kingdom, EPCOT, Hollywood Studios, and Animal Kingdom.</p><p>Choose a unique token, roll both dice, and move the combined total (2–12 spaces) around the board. Rolling doubles opens a popup asking whether the rolling player wants to buy one pin not owned by any player for $100, or skip, including on transportation bonus rolls. No doubles cash payout is given. Doubles do not give an extra turn. When you land on an unowned attraction, the game checks whether you can afford it. If you can, choose whether to attempt the purchase; answering the park-themed trivia correctly buys it automatically. If you cannot afford it, your turn ends. Land on another player\'s property to see a rent popup. Choose to pay the rent or use a Magic Rent Pass (the bank pays the owner). If you cannot afford rent and choose &ldquo;I spent all my money at Disney!&rdquo;, your remaining money goes to the owner and you lose the game. Your turns are skipped, your pawn is removed, and your properties return to the bank. Remaining players continue toward the Castle Finale. The four middle-of-the-park <strong>Nighttime Show</strong> spaces cost $200 each and work as a set: rent is $25 with 1 show, $50 with 2, $100 with 3, and $200 with all 4.</p><p>All four corners are <strong>transportation hubs</strong>. If you land exactly on one, you may choose to roll again and travel that many extra spaces. Completing a lap does not pay money.</p><p><strong>Magic &amp; Mischief:</strong> Land on either card space on a park side to draw from the shared pile of 45 cards. Apply its reward, function resize(){if(flat)return;const r=canvas.getBoundingClientRect();width=r.width;height=r.height;if(!width||!height)return;renderer.setSize(width,height,false);camera.aspect=width/height;camera.updateProjectionMatrix();cameraTarget();}
host.querySelectorAll('[data-camera]').forEach(b=>b.addEventListener('click',()=>{
 const v=b.dataset.camera;
 if(v==='flat'){flat=!flat;layout.classList.toggle('classic-board',flat);b.setAttribute('aria-pressed',String(flat));if(!flat){updateBoardSpaceLayout();resize();sync()}else updateBoardSpaceLayout();return;}
 if(v==='left'||v==='right'){freeCamera();targetAngle+=(v==='left'?-1:1)*Math.PI/6;}
 else if(v==='follow')followPawn(currentPlayer,false);
 else{freeCamera();if(v==='board'){mode='board';zoom=1;host.querySelector('input').value=100;targetAngle=.24;}updateCameraButtons();}
 cameraTarget();
}));
function setZoom(value){const next=Math.max(.7,Math.min(3.2,value));targetDistance*=zoom/next;zoom=next;host.querySelector('input').value=Math.round(zoom*100);cameraTarget();}
host.querySelector('input').addEventListener('input',e=>setZoom(Number(e.target.value)/100));
host.querySelectorAll('[data-drag-mode]').forEach(b=>b.addEventListener('click',()=>{dragMode=b.dataset.dragMode;host.querySelectorAll('[data-drag-mode]').forEach(button=>button.setAttribute('aria-pressed',String(button===b)));}));
const ground=new THREE.Plane(new THREE.Vector3(0,1,0),-.3);
function groundPoint(x,y){const r=canvas.getBoundingClientRect();ray.setFromCamera(new THREE.Vector2((x-r.left)/r.width*2-1,-(y-r.top)/r.height*2+1),camera);return ray.ray.intersectPlane(ground,new THREE.Vector3());}
function panBetween(from,to){if(!from||!to)return;freeCamera();const shift=from.clone().sub(to);target.x=Math.max(-20,Math.min(20,target.x+shift.x));target.z=Math.max(-20,Math.min(20,target.z+shift.z));const delta=new THREE.Vector3(target.x-look.x,0,target.z-look.z);look.x=target.x;look.z=target.z;camera.position.add(delta);camera.lookAt(look);camera.updateMatrixWorld(true);drawRequest();}
function pinchState(){const points=[...pointers.values()];if(points.length<2)return null;const [a,b]=points;return {x:(a.x+b.x)/2,y:(a.y+b.y)/2,distance:Math.hypot(a.x-b.x,a.y-b.y)};}
canvas.addEventListener('contextmenu',e=>e.preventDefault());
canvas.addEventListener('pointerdown',e=>{
 if(e.button!==0&&e.button!==2)return;
 canvas.focus({preventScroll:true});canvas.setPointerCapture(e.pointerId);pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});
 if(pointers.size>1){pinch=pinchState();if(drag)drag.moved=true;return;}
 drag={id:e.pointerId,x:e.clientX,y:e.clientY,angle:targetAngle,moved:false,orbit:e.shiftKey||e.button===2||dragMode==='orbit',ground:groundPoint(e.clientX,e.clientY)};
});
canvas.addEventListener('pointermove',e=>{
 if(!pointers.has(e.pointerId))return;
 pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});
 if(pointers.size>1){const next=pinchState();if(pinch&&next){panBetween(groundPoint(pinch.x,pinch.y),groundPoint(next.x,next.y));if(pinch.distance>0)setZoom(zoom*next.distance/pinch.distance);}pinch=next;return;}
 if(!drag||drag.id!==e.pointerId)return;
 const dx=e.clientX-drag.x,dy=e.clientY-drag.y;if(Math.hypot(dx,dy)>5)drag.moved=true;
 if(drag.moved){if(drag.orbit){freeCamera();targetAngle=drag.angle-dx*.006;drawRequest();}else panBetween(drag.ground,groundPoint(e.clientX,e.clientY));}
});
function endPointer(e,cancelled){
 const tap=drag&&drag.id===e.pointerId&&!drag.moved&&pointers.size===1&&!cancelled;
 pointers.delete(e.pointerId);pinch=null;
 if(tap){const r=canvas.getBoundingClientRect();ray.setFromCamera(new THREE.Vector2((e.clientX-r.left)/r.width*2-1,-(e.clientY-r.top)/r.height*2+1),camera);const hit=ray.intersectObjects([...tileMeshes.filter(mesh=>mesh.visible),...centerTargets]);if(hit.length){const d=hit[0].object.userData;if(d.space!==undefined)info(d.space);else{const b=document.getElementById(d.control);if(b&&!b.disabled)b.click();}}}
 drag=null;
 if(pointers.size===1){const [id,point]=[...pointers][0];drag={id,x:point.x,y:point.y,angle:targetAngle,moved:true,orbit:false,ground:groundPoint(point.x,point.y)};}
}
canvas.addEventListener('pointerup',e=>endPointer(e,false));canvas.addEventListener('pointercancel',e=>endPointer(e,true));canvas.addEventListener('lostpointercapture',e=>{if(pointers.has(e.pointerId))endPointer(e,true);});
canvas.addEventListener('wheel',e=>{e.preventDefault();setZoom(zoom*Math.exp(-e.deltaY*.001));},{passive:false});
canvas.addEventListener('keydown',e=>{
 const key=e.key.toLowerCase(),step=targetDistance*.035;
 const moves={arrowleft:[-1,0],a:[-1,0],arrowright:[1,0],d:[1,0],arrowup:[0,-1],w:[0,-1],arrowdown:[0,1],s:[0,1]};
 if(moves[key]){e.preventDefault();freeCamera();const [x,z]=moves[key];target.x=Math.max(-20,Math.min(20,target.x+(x*Math.cos(angle)+z*Math.sin(angle))*step));target.z=Math.max(-20,Math.min(20,target.z+(-x*Math.sin(angle)+z*Math.cos(angle))*step));drawRequest();}
 else if(['+','=','-','_'].includes(key)){e.preventDefault();setZoom(zoom*(key==='-'||key==='_'?.9:1.1));}
});
host.querySelector('#board3dInfo').addEventListener('click',e=>{const button=e.target.closest('[data-space-step]');if(button){const step=button.dataset.spaceStep;info((selected+Number(step)+SPACES.length)%SPACES.length);host.querySelector('[data-space-step="'+step+'"]').focus({preventScroll:true});}});
const namesButton=host.querySelector('[data-space-labels]');namesButton.addEventListener('click',()=>{showSpaceNames=!showSpaceNames;spaceLabels.forEach(label=>label.visible=showSpaceNames);namesButton.setAttribute('aria-pressed',String(showSpaceNames));cameraTarget();});
const lightButton=host.querySelector('[data-light-toggle]');lightButton.addEventListener('click',()=>{const night=lightButton.getAttribute('aria-pressed')!=='true';lightButton.setAttribute('aria-pressed',String(night));host.classList.toggle('daylight',!night);hemisphere.intensity=night?.85:2;key.intensity=night?1.9:3.1;rim.intensity=night?1.25:2;scene.environmentIntensity=night?.45:1;lamp.intensity=night?14:9;renderer.toneMappingExposure=night?.92:1.13;drawRequest();});
const motionButton=host.querySelector('[data-ride-motion]');motionButton.addEventListener('click',()=>{rideMotion=!rideMotion;motionButton.setAttribute('aria-pressed',String(rideMotion));drawRequest();});const resumeRides=()=>{if(!document.hidden)drawRequest();};document.addEventListener('visibilitychange',resumeRides);
resizeObserver.observe(canvas);activeView={sync,escort:escortToCheckpoint,flat:()=>flat,dice:values=>{diceValues=values.slice();diceStart=reducedMotion()?0:performance.now();drawRequest();},dispose:()=>{document.removeEventListener('visibilitychange',resumeRides);resizeObserver.disconnect();cancelAnimationFrame(raf);renderer.dispose();}};resize();sync();
}
const oldRenderGame=renderGame;renderGame=function(){if(activeView){activeView.dispose();activeView=null}oldRenderGame();window.scrollTo({top:0,behavior:'instant'});mount().catch(error=>{console.error('Could not render 3D board',error);const game=document.querySelector('.with-3d');if(game)game.classList.add('classic-board');updateBoardSpaceLayout();});};
for(const name of ['renderTokens','renderOwners','renderAll']){const original=window[name];window[name]=function(...args){const result=original.apply(this,args);if(activeView)activeView.sync();return result;};}
const oldCloseup=showPawnCloseup;showPawnCloseup=function(...args){if(activeView&&!activeView.flat())return;return oldCloseup.apply(this,args)};
const oldTrack=trackMovingPiece;trackMovingPiece=function(...args){if(activeView&&!activeView.flat())return;return oldTrack.apply(this,args)};
const originalSecurityEscort=animateSecurityEscort;animateSecurityEscort=async function(index){if(activeView&&!activeView.flat())return activeView.escort(index);return originalSecurityEscort(index);};
const oldDice=animateDice;animateDice=async function(values){
 if(!activeView||activeView.flat())return oldDice(values);
 playGameSound('dice');
 activeView.dice(values);
 await wait(reducedMotion()?1100:1150);
 setRestingDice(values);
 setStatus('Rolled <strong>'+values[0]+' + '+values[1]+' = '+(values[0]+values[1])+'</strong>. Get ready to move…');
};
})();
