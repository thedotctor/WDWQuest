<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>WDWQuest Pin Drop</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
:root{--bg:#07111f;--panel:#111c31;--border:#2b3b5a;--text:#f7f8fc;--muted:#aeb9cf;--accent:#7dd3fc;--good:#86efac;--gold:#fde68a}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif}
main{max-width:1050px;margin:auto;padding:24px}.panel{background:var(--panel);border:1px solid var(--border);border-radius:18px;padding:18px}
h1{margin:0 0 6px}.muted{color:var(--muted)}.score{display:flex;gap:10px;flex-wrap:wrap;margin:12px 0}.pill{border:1px solid var(--border);border-radius:999px;padding:7px 10px}
.photo{max-width:600px;aspect-ratio:3/2;margin:14px auto;overflow:hidden;border-radius:16px;border:1px solid var(--border);background:#050b14}.photo img{width:100%;height:100%;object-fit:cover}
#map{height:430px;border-radius:16px;border:1px solid var(--border);overflow:hidden}.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px}
button{min-height:44px;border-radius:12px;border:1px solid var(--border);padding:10px 14px;font-weight:800;cursor:pointer}.primary{background:var(--accent);color:#082137}.secondary{background:#17243d;color:var(--text)}
#status{margin-top:12px;font-weight:800}.good{color:var(--good)}a{color:var(--accent)}.credit{font-size:12px;color:var(--muted);margin-top:10px}
@media(max-width:650px){#map{height:350px}}

/* v0.5.1 iPhone/mobile polish */
html{-webkit-text-size-adjust:100%}
body{padding-left:env(safe-area-inset-left);padding-right:env(safe-area-inset-right)}
button{touch-action:manipulation}
@media(max-width:650px){
  main{padding:12px}
  .panel{padding:14px;border-radius:14px}
  h1{font-size:27px;line-height:1.1}
  .photo{margin:12px auto;border-radius:12px}
  #map{height:320px;border-radius:12px;touch-action:pan-x pan-y}
  .actions{display:grid;grid-template-columns:1fr;gap:8px}
  .actions button{width:100%;min-height:50px;font-size:16px}
  .score{gap:7px}
  .pill{padding:7px 9px;font-size:14px}
  #status{line-height:1.35}
  .credit{font-size:11px;line-height:1.45}
  .leaflet-control-zoom a{width:38px!important;height:38px!important;line-height:38px!important;font-size:22px!important}
}
@media(max-width:390px){
  main{padding:9px}
  .panel{padding:12px}
  #map{height:290px}
}

</style>
</head>
<body>
<main>
<p><a href="arcade.html">← Back to WDWQuest Arcade</a></p>
<div class="panel">
<h1>📍 WDW Pin Drop</h1>
<p class="muted">Endless WDW location challenge. Study the photo, drop your pin, lock the guess, and keep going for as long as you want.</p>
<div class="score"><span class="pill" id="round">Location 1</span><span class="pill" id="score">Score: 0</span></div>
<div class="photo"><img id="photo" alt="WDW location challenge"></div>
<div id="map"></div>
<div id="status">Click the map to place your pin.</div>
<div class="actions"><button id="lock" class="primary" disabled>Lock Guess</button><button id="next" class="secondary" style="display:none">Next Location</button></div>
<div id="result"></div><div class="credit" id="credit"></div>
</div>
</main>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

let deck=[],current=null,round=1,total=0,map,guessMarker,targetMarker,line,guess=null,locked=false;
function shuffle(a){const b=[...a];for(let i=b.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[b[i],b[j]]=[b[j],b[i]]}return b}
function refill(){deck=shuffle(PHOTOS)}
function targetFor(x){return GEO.targets[x.answer]||GEO.fallbackAreas[x.park+'|'+x.area]||[28.3852,-81.5639]}
function meters(a,b){const R=6371000,r=x=>x*Math.PI/180,p1=r(a.lat),p2=r(b.lat),dp=r(b.lat-a.lat),dl=r(b.lng-a.lng);const h=Math.sin(dp/2)**2+Math.cos(p1)*Math.cos(p2)*Math.sin(dl/2)**2;return 2*R*Math.asin(Math.sqrt(h))}
function points(m){if(m<=100)return 5000;return Math.max(0,Math.round(5000*Math.exp(-(m-100)/1800)))}
function fmt(m){return m<1000?Math.round(m)+' m':(m/1000).toFixed(m<10000?2:1)+' km'}
function newRound(){
 if(!deck.length)refill();current=deck.pop();locked=false;guess=null;
 document.getElementById('round').textContent='Location '+round;
 document.getElementById('score').textContent='Score: '+total.toLocaleString();
 document.getElementById('status').textContent='Click the map to place your pin.';
 document.getElementById('result').innerHTML='';document.getElementById('credit').innerHTML='';
 document.getElementById('lock').disabled=true;document.getElementById('next').style.display='none';
 const img=document.getElementById('photo');let fallback=false;img.onerror=()=>{if(!fallback&&current.fallbackSrc){fallback=true;img.src=current.fallbackSrc}else document.getElementById('status').textContent='Photo could not load.'};img.src=current.src;
 if(map)map.remove();
 map=L.map('map').setView([28.3852,-81.5639],13);
 L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'&copy; OpenStreetMap contributors'}).addTo(map);
 map.on('click',e=>{if(locked)return;guess=e.latlng;if(guessMarker)guessMarker.setLatLng(e.latlng);else guessMarker=L.marker(e.latlng).addTo(map);document.getElementById('lock').disabled=false;document.getElementById('status').textContent='Pin placed. Lock it when ready.'});
 guessMarker=null;targetMarker=null;line=null;
 setTimeout(()=>map.invalidateSize(),100);
}
document.getElementById('lock').addEventListener('click',()=>{
 if(!guess||locked)return;locked=true;document.getElementById('lock').disabled=true;
 const t=targetFor(current),actual={lat:t[0],lng:t[1]},d=meters(guess,actual),p=points(d);total+=p;
 targetMarker=L.circleMarker([actual.lat,actual.lng],{radius:9,weight:3,fillOpacity:.8}).addTo(map).bindPopup('Actual: '+current.answer).openPopup();
 line=L.polyline([[guess.lat,guess.lng],[actual.lat,actual.lng]],{weight:3,dashArray:'8 8'}).addTo(map);map.fitBounds(line.getBounds(),{padding:[40,40],maxZoom:17});
 document.getElementById('status').innerHTML='<span class="good">Locked!</span> '+p.toLocaleString()+' points';
 document.getElementById('result').innerHTML='<p><b>'+current.answer+'</b> • '+current.area+' • '+fmt(d)+' away</p>';
 document.getElementById('score').textContent='Score: '+total.toLocaleString();
 document.getElementById('credit').innerHTML='Photo: <a target="_blank" rel="noopener" href="'+current.source+'">'+current.credit+'</a> • '+current.license;
 document.getElementById('next').style.display='inline-block';
});
document.getElementById('next').addEventListener('click',()=>{round++;newRound()});
if(typeof L==='undefined'){document.getElementById('status').textContent='Map library did not load.'}else newRound();
</script>
