<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>WDWQuest Photo Test</title>
<style>
body{font-family:system-ui;background:#07111f;color:white;padding:20px}
.card{max-width:900px;margin:auto;background:#111c31;border:1px solid #2b3b5a;border-radius:18px;padding:18px}
img{width:100%;max-height:600px;object-fit:contain;background:#050b14;border-radius:14px}
.ok{color:#86efac}.bad{color:#fca5a5}a{color:#7dd3fc}
</style></head><body><div class="card">
<h1>WDWQuest Photo Test</h1>
<p>This page tests one Wikimedia image directly from GitHub Pages.</p>
<img id="testImg" alt="WDW test photo">
<p id="status">Loading…</p>
<p><a href="https://commons.wikimedia.org/wiki/File:A-Wing_Fighter_(49560968217).jpg">Open source page</a></p>
<script>
const img=document.getElementById('testImg'), status=document.getElementById('status');
let fallback=false;
img.onload=()=>{status.innerHTML='<span class="ok">✓ Photo loaded successfully.</span>';}
img.onerror=()=>{
 if(!fallback){fallback=true;status.textContent='Primary failed; trying fallback…';img.src="https://commons.wikimedia.org/wiki/Special:Redirect/file/A-Wing_Fighter_(49560968217).jpg?width=960";}
 else status.innerHTML='<span class="bad">✗ Both image methods failed.</span>';
};
img.src="https://upload.wikimedia.org/wikipedia/commons/thumb/a/ae/A-Wing_Fighter_(49560968217).jpg/960px-A-Wing_Fighter_(49560968217).jpg";
</script></div></body></html>
