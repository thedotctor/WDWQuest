:root{
  --bg:#07111f;--panel:#111c31;--panel2:#17243d;--text:#f7f8fc;--muted:#aeb9cf;
  --border:#2b3b5a;--accent:#7dd3fc;--accent2:#c4b5fd;--good:#86efac;--bad:#fca5a5;
  --gold:#fde68a;--shadow:0 18px 50px rgba(0,0,0,.22)
}
*{box-sizing:border-box}
html{color-scheme:dark}
body{margin:0;font-family:Inter,ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;background:
  radial-gradient(circle at top left,rgba(125,211,252,.10),transparent 30%),
  radial-gradient(circle at top right,rgba(196,181,253,.10),transparent 28%),var(--bg);color:var(--text);min-height:100vh}
button,input,select{font:inherit}
button{cursor:pointer}
.site-header{position:sticky;top:0;z-index:20;display:flex;justify-content:space-between;gap:14px;align-items:center;padding:12px 18px;background:rgba(7,17,31,.92);backdrop-filter:blur(14px);border-bottom:1px solid var(--border)}
.brand{display:flex;align-items:center;gap:8px;background:none;border:0;color:var(--text);font-weight:900;font-size:20px}
.site-header nav{display:flex;gap:7px;flex-wrap:wrap}
.site-header nav button{background:transparent;color:var(--muted);border:1px solid transparent;padding:8px 10px;border-radius:10px}
.site-header nav button:hover{color:var(--text);border-color:var(--border)}
.page-shell{max-width:1120px;margin:0 auto;padding:28px 18px 48px}
.hero{padding:34px 0 18px}
.eyebrow{font-size:13px;text-transform:uppercase;letter-spacing:.14em;color:var(--accent);font-weight:900}
h1{font-size:clamp(38px,7vw,72px);line-height:.98;margin:8px 0 12px}
h2{font-size:clamp(26px,4vw,40px);margin:0 0 8px}
h3{margin:0 0 8px}
.lead{max-width:760px;color:var(--muted);font-size:clamp(17px,2.4vw,21px);line-height:1.55}
.game-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px;margin-top:24px}
.card{background:linear-gradient(180deg,rgba(23,36,61,.98),rgba(17,28,49,.98));border:1px solid var(--border);border-radius:20px;padding:20px;box-shadow:var(--shadow)}
.game-card{min-height:220px;display:flex;flex-direction:column}
.game-card .icon{font-size:34px;margin-bottom:16px}
.game-card p{color:var(--muted);line-height:1.5;flex:1}
.primary,.secondary,.answer-btn,.jeopardy-cell{border:1px solid var(--border);border-radius:12px;padding:11px 14px;font-weight:800}
.primary{background:var(--accent);color:#082137;border-color:transparent}
.secondary{background:var(--panel2);color:var(--text)}
.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px}
.stats-row{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin:20px 0}
.stat{background:var(--panel);border:1px solid var(--border);border-radius:16px;padding:16px}
.stat .n{font-size:28px;font-weight:900}
.stat .label{color:var(--muted);font-size:13px}
.panel{background:var(--panel);border:1px solid var(--border);border-radius:20px;padding:20px}
.filters{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:18px}
select,input{background:#0b1527;color:var(--text);border:1px solid var(--border);border-radius:11px;padding:11px 12px;min-height:44px}
.question{font-size:clamp(24px,3.7vw,38px);line-height:1.25;margin:18px 0}
.answers{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.answer-btn{background:#14223a;color:var(--text);text-align:left;min-height:58px}
.answer-btn:hover{background:#1b2c49}
.answer-btn.correct{outline:2px solid var(--good);background:#133524}
.answer-btn.wrong{outline:2px solid var(--bad);background:#3c2027}
.feedback{min-height:28px;font-weight:800;margin-top:14px}
.good{color:var(--good)}.bad{color:var(--bad)}.gold{color:var(--gold)}.muted{color:var(--muted)}
.progress{height:9px;border-radius:999px;background:#0b1527;overflow:hidden;margin:14px 0}
.progress>span{display:block;height:100%;background:linear-gradient(90deg,var(--accent),var(--accent2))}
.clue-card{font-size:clamp(22px,3.5vw,34px);line-height:1.35;padding:22px;background:#0b1527;border:1px solid var(--border);border-radius:16px;margin:16px 0}
.jeopardy-wrap{overflow-x:auto}
.jeopardy-board{min-width:800px;display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.jeopardy-head{background:#152749;border:1px solid var(--border);padding:14px 10px;border-radius:10px;text-align:center;font-weight:900;min-height:74px;display:flex;align-items:center;justify-content:center}
.jeopardy-cell{background:#193768;color:var(--gold);font-size:24px;min-height:88px}
.jeopardy-cell.used{opacity:.22;cursor:default}
.modalish{margin-top:18px;background:#0b1527;border:1px solid var(--border);padding:18px;border-radius:16px}
.score-banner{display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:wrap}
.badge{display:inline-block;border:1px solid var(--border);border-radius:999px;padding:6px 10px;color:var(--muted);font-size:13px}
.list{display:grid;gap:8px;margin-top:12px}
.row{display:flex;justify-content:space-between;gap:12px;border-bottom:1px solid var(--border);padding:9px 0}
footer{text-align:center;color:#7f8ba6;font-size:12px;padding:0 18px 26px}
@media(max-width:800px){.game-grid{grid-template-columns:1fr}.stats-row{grid-template-columns:1fr 1fr}.answers{grid-template-columns:1fr}.site-header{align-items:flex-start;flex-direction:column}.site-header nav{width:100%;overflow:auto;flex-wrap:nowrap}}
@media(max-width:420px){.stats-row{grid-template-columns:1fr}.page-shell{padding-left:12px;padding-right:12px}}

</style>

        "answer": "It's Tough to Be a Bug!"
      }
    ],
    "Resorts": [
      {
        "value": 100,
        "clue": "The monorail passes directly through this resort's main building.",
        "answer": "Disney's Contemporary Resort"
      },
      {
        "value": 200,
        "clue": "This resort shares a Skyliner station with Art of Animation.",
        "answer": "Disney's Pop Century Resort"
      },
      {
        "value": 300,
        "clue": "Topolino's Terrace is located at the top of this resort.",
        "answer": "Disney's Riviera Resort"
      },
      {
        "value": 400,
        "clue": "This resort's theme evokes grand national park lodges and includes a geyser.",
        "answer": "Disney's Wilderness Lodge"
      },
      {
        "value": 500,
        "clue": "Stormalong Bay is shared by this resort and its Yacht Club neighbor.",
        "answer": "Disney's Beach Club Resort"
      }
    ]
  }
};
</script>
  <script>

(() => {
  const DATA = window.WDWQUEST_DATA;
  const app = document.getElementById('app');

  const defaults = {
    totalAnswered:0, correct:0, bestStreak:0, streak:0, totalScore:0,
    gamesPlayed:{trivia:0,where:0,jeopardy:0},
    byPark:{}, achievements:[]
  };
  let stats = loadStats();

  function loadStats(){
    try{
      const saved = JSON.parse(localStorage.getItem('wdwquest_stats') || 'null');
      return Object.assign(structuredClone(defaults), saved || {});
    }catch(e){ return structuredClone(defaults); }
  }
  function saveStats(){ localStorage.setItem('wdwquest_stats', JSON.stringify(stats)); }
  function esc(s){ return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m])); }
  function shuffle(a){ const b=[...a]; for(let i=b.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[b[i],b[j]]=[b[j],b[i]];} return b; }
  function pct(){ return stats.totalAnswered ? Math.round((stats.correct/stats.totalAnswered)*100) : 0; }
  function record(park, correct, points=0){
    stats.totalAnswered++;
    if(correct){ stats.correct++; stats.streak++; stats.bestStreak=Math.max(stats.bestStreak,stats.streak); }
    else stats.streak=0;
    stats.totalScore += points;
    if(park){
      stats.byPark[park] ||= {answered:0,correct:0};
      stats.byPark[park].answered++;
      if(correct) stats.byPark[park].correct++;
    }
    unlocks();
    saveStats();
  }
  function unlocks(){
    const add = a => { if(!stats.achievements.includes(a)) stats.achievements.push(a); };
    if(stats.correct>=10) add('🏰 Rope Drop Rookie');
    if(stats.correct>=25) add('🎢 Park Hopper');
    if(stats.bestStreak>=10) add('🔥 Ten in a Row');
    if(stats.correct>=50) add('🌐 World Traveler');
    if(stats.totalAnswered>=100) add('🧠 Disney Brain');
  }
  function nav(view){ history.replaceState(null,'','#'+view); render(view); window.scrollTo({top:0,behavior:'smooth'}); }
  document.addEventListener('click',e=>{
    const b=e.target.closest('[data-nav]');
    if(b) nav(b.dataset.nav);
  });

  function home(){
    return `
      <section class="hero">
        <div class="eyebrow">Unofficial Walt Disney World fan-game arcade</div>
        <h1>WDWQuest</h1>
        <p class="lead">How well do you really know the World? Jump between trivia, location clues, and a full Jeopardy-style board. Your browser keeps your stats without an account.</p>
      </section>
      <section class="stats-row">
        <div class="stat"><div class="n">${stats.totalScore}</div><div class="label">Total score</div></div>
        <div class="stat"><div class="n">${pct()}%</div><div class="label">Accuracy</div></div>
        <div class="stat"><div class="n">${stats.bestStreak}</div><div class="label">Best streak</div></div>
        <div class="stat"><div class="n">${stats.totalAnswered}</div><div class="label">Questions answered</div></div>
      </section>
      <section class="game-grid">
        <article class="card game-card"><div class="icon">🎯</div><h3>WDW Trivia</h3><p>Traditional questions across parks, resorts, food, transportation, queues, and more.</p><button class="primary" data-nav="trivia">Play Trivia</button></article>
        <article class="card game-card"><div class="icon">🔎</div><h3>Where Am I?</h3><p>Three increasingly obvious clues. Guess early for more points.</p><button class="primary" data-nav="where">Play Where Am I?</button></article>
        <article class="card game-card"><div class="icon">💰</div><h3>WDW Jeopardy</h3><p>Five categories, five values each, and a board that gets harder as the dollars climb.</p><button class="primary" data-nav="jeopardy">Play Jeopardy</button></article>
      </section>`;
  }

  function renderTrivia(){
    const qs = DATA.questions.filter(q=>q.type==='trivia');
    app.innerHTML = `
      <section class="score-banner"><div><div class="eyebrow">Game 1</div><h2>WDW Trivia</h2></div><span class="badge">Saved score: ${stats.totalScore}</span></section>
      <div class="filters">
        <select id="triviaDiff"><option>All</option><option>Casual</option><option>Fan</option><option>Expert</option><option>Local Legend</option></select>
        <select id="triviaPark"><option>All</option><option>Magic Kingdom</option><option>EPCOT</option><option>Hollywood Studios</option><option>Animal Kingdom</option><option>Resorts</option><option>Disney Springs</option></select>
      </div>
      <section class="panel">
        <div class="badge" id="tMeta">Ready</div>
        <div class="question" id="tQuestion"></div>
        <div class="answers" id="tAnswers"></div>
        <div class="feedback" id="tFeedback"></div>
        <div class="actions"><button id="tNext" class="primary">Next Question</button></div>
      </section>`;
    let current=null, answered=false;
    function next(){
      const diff=document.getElementById('triviaDiff').value, park=document.getElementById('triviaPark').value;
      const pool=qs.filter(q=>(diff==='All'||q.difficulty===diff)&&(park==='All'||q.park===park));
      if(!pool.length){ document.getElementById('tQuestion').textContent='No questions match those filters yet.'; document.getElementById('tAnswers').innerHTML=''; return; }
      current=pool[Math.floor(Math.random()*pool.length)]; answered=false;
      document.getElementById('tMeta').textContent=`${current.park} • ${current.category} • ${current.difficulty}`;
      document.getElementById('tQuestion').textContent=current.question;
      const box=document.getElementById('tAnswers'); box.innerHTML='';
      shuffle(current.choices).forEach(c=>{
        const b=document.createElement('button'); b.className='answer-btn'; b.textContent=c;
        b.addEventListener('click',()=>{
          if(answered) return; answered=true;
          const ok=c===current.answer;
          record(current.park,ok,ok?100:0);
          document.querySelectorAll('#tAnswers button').forEach(x=>{x.disabled=true;if(x.textContent===current.answer)x.classList.add('correct');});
          if(!ok)b.classList.add('wrong');
          document.getElementById('tFeedback').innerHTML=ok?'<span class="good">Correct! +100</span>':`<span class="bad">Not quite.</span> Answer: ${esc(current.answer)}`;
        });
        box.appendChild(b);
      });
      document.getElementById('tFeedback').textContent='';
    }
    document.getElementById('tNext').addEventListener('click',next);
    document.getElementById('triviaDiff').addEventListener('change',next);
    document.getElementById('triviaPark').addEventListener('change',next);
    stats.gamesPlayed.trivia++; saveStats(); next();
  }

  function renderWhere(){
    const qs = DATA.questions.filter(q=>q.type==='where');
    app.innerHTML = `
      <section class="score-banner"><div><div class="eyebrow">Game 2</div><h2>Where Am I?</h2></div><span class="badge">Guess on clue 1 for 100 points</span></section>
      <div class="filters">
        <select id="wDiff"><option>All</option><option>Fan</option><option>Expert</option><option>Local Legend</option></select>
        <select id="wPark"><option>All</option><option>Magic Kingdom</option><option>EPCOT</option><option>Hollywood Studios</option><option>Animal Kingdom</option><option>Resorts</option><option>Disney Springs</option></select>
      </div>
      <section class="panel">
        <div class="badge" id="wMeta">Ready</div>
        <div class="progress"><span id="wProg" style="width:33%"></span></div>
        <div class="clue-card" id="wClue"></div>
        <div class="answers" id="wAnswers"></div>
        <div class="feedback" id="wFeedback"></div>
        <div class="actions"><button id="wClueBtn" class="secondary">Another clue</button><button id="wNext" class="primary">Next location</button></div>
      </section>`;
    let current=null, clue=0, answered=false;
    function next(){
      const diff=document.getElementById('wDiff').value, park=document.getElementById('wPark').value;
      const pool=qs.filter(q=>(diff==='All'||q.difficulty===diff)&&(park==='All'||q.park===park));
      if(!pool.length){document.getElementById('wClue').textContent='No locations match those filters yet.';return;}
      current=pool[Math.floor(Math.random()*pool.length)]; clue=0; answered=false;
      document.getElementById('wMeta').textContent=`${current.park} • ${current.difficulty}`;
      document.getElementById('wFeedback').textContent=''; renderClue(); renderChoices();
    }
    function renderClue(){
      document.getElementById('wClue').textContent=current.clues[clue];
      document.getElementById('wProg').style.width=`${(clue+1)*33.333}%`;
      document.getElementById('wClueBtn').disabled=clue>=2||answered;
    }
    function renderChoices(){
      let pool=shuffle(qs.filter(q=>q.answer!==current.answer));
      const opts=shuffle([current.answer,...pool.slice(0,3).map(x=>x.answer)]);
      const box=document.getElementById('wAnswers');box.innerHTML='';
      opts.forEach(c=>{
        const b=document.createElement('button');b.className='answer-btn';b.textContent=c;
        b.addEventListener('click',()=>{
          if(answered)return; answered=true;
          const ok=c===current.answer, pts=ok?[100,70,40][clue]:0;
          record(current.park,ok,pts);
          document.querySelectorAll('#wAnswers button').forEach(x=>{x.disabled=true;if(x.textContent===current.answer)x.classList.add('correct');});
          if(!ok)b.classList.add('wrong');
          document.getElementById('wFeedback').innerHTML=ok?`<span class="good">Correct! +${pts}</span> • ${esc(current.area)}`:`<span class="bad">Not quite.</span> ${esc(current.answer)} • ${esc(current.area)}`;
          document.getElementById('wClueBtn').disabled=true;
        });
        box.appendChild(b);
      });
    }
    document.getElementById('wClueBtn').addEventListener('click',()=>{if(!answered&&clue<2){clue++;renderClue();}});
    document.getElementById('wNext').addEventListener('click',next);
    document.getElementById('wDiff').addEventListener('change',next);
    document.getElementById('wPark').addEventListener('change',next);
    stats.gamesPlayed.where++; saveStats(); next();
  }

  function renderJeopardy(){
    const cats=Object.keys(DATA.jeopardy);
    app.innerHTML=`
      <section class="score-banner"><div><div class="eyebrow">Game 3</div><h2>WDW Jeopardy</h2></div><div class="stat"><div class="n" id="jScore">$0</div><div class="label">Board score</div></div></section>
      <section class="panel jeopardy-wrap"><div class="jeopardy-board" id="jBoard"></div></section>
      <section class="modalish" id="jClue"><div class="muted">Choose a dollar value to begin.</div></section>`;
    let jscore=0;
    const used=new Set();
    const board=document.getElementById('jBoard');
    cats.forEach(c=>{const h=document.createElement('div');h.className='jeopardy-head';h.textContent=c;board.appendChild(h);});
    for(let row=0;row<5;row++){
      cats.forEach(c=>{
        const item=DATA.jeopardy[c][row];
        const b=document.createElement('button');b.className='jeopardy-cell';b.textContent='$'+item.value;
        const key=c+row;
        b.addEventListener('click',()=>{
          if(used.has(key))return;
          document.getElementById('jClue').innerHTML=`
            <div class="badge">${esc(c)} • $${item.value}</div>
            <div class="question">${esc(item.clue)}</div>
            <input id="jInput" placeholder="Type your answer" autocomplete="off">
            <div class="actions"><button id="jSubmit" class="primary">Submit</button><button id="jReveal" class="secondary">Reveal answer</button></div>
            <div id="jFeedback" class="feedback"></div>`;
          const finish=(ok)=>{
            used.add(key);b.classList.add('used');b.disabled=true;
            if(ok){jscore+=item.value;record(c==='Resorts'?'Resorts':c,true,item.value);}
            else{jscore=Math.max(0,jscore-item.value);record(c==='Resorts'?'Resorts':c,false,0);}
            document.getElementById('jScore').textContent='$'+jscore;
          };
          document.getElementById('jSubmit').addEventListener('click',()=>{
            if(used.has(key))return;
            const guess=document.getElementById('jInput').value.trim().toLowerCase();
            const ans=item.answer.toLowerCase();
            const ok=guess && (ans.includes(guess)||guess.includes(ans));
            finish(ok);
            document.getElementById('jFeedback').innerHTML=ok?'<span class="good">Correct!</span>':`<span class="bad">Not quite.</span> Answer: ${esc(item.answer)}`;
            document.getElementById('jSubmit').disabled=true;document.getElementById('jReveal').disabled=true;
          });
          document.getElementById('jReveal').addEventListener('click',()=>{
            if(used.has(key))return;
            finish(false);
            document.getElementById('jFeedback').innerHTML=`Answer: <span class="gold">${esc(item.answer)}</span>`;
            document.getElementById('jSubmit').disabled=true;document.getElementById('jReveal').disabled=true;
          });
        });
        board.appendChild(b);
      });
    }
    stats.gamesPlayed.jeopardy++; saveStats();
  }

  function renderStats(){
    const parkRows=Object.entries(stats.byPark).sort((a,b)=>b[1].answered-a[1].answered).map(([p,s])=>{
      const a=s.answered?Math.round(s.correct/s.answered*100):0;
      return `<div class="row"><span>${esc(p)}</span><strong>${a}% (${s.correct}/${s.answered})</strong></div>`;
    }).join('') || '<div class="muted">Play a few rounds and your park-by-park stats will appear here.</div>';
    const ach=stats.achievements.map(a=>`<div class="row"><span>${esc(a)}</span><span>Unlocked</span></div>`).join('') || '<div class="muted">No achievements yet. Go break something.</div>';
    app.innerHTML=`
      <section class="hero"><div class="eyebrow">Your local profile</div><h2>Player Stats</h2><p class="lead">Stored only in this browser. No account required.</p></section>
      <section class="stats-row">
        <div class="stat"><div class="n">${stats.totalScore}</div><div class="label">Total score</div></div>
        <div class="stat"><div class="n">${pct()}%</div><div class="label">Accuracy</div></div>
        <div class="stat"><div class="n">${stats.bestStreak}</div><div class="label">Best streak</div></div>
        <div class="stat"><div class="n">${stats.totalAnswered}</div><div class="label">Answered</div></div>
      </section>
      <section class="game-grid" style="grid-template-columns:1fr 1fr">
        <div class="card"><h3>Park accuracy</h3><div class="list">${parkRows}</div></div>
        <div class="card"><h3>Achievements</h3><div class="list">${ach}</div></div>
      </section>
      <div class="actions"><button id="resetStats" class="secondary">Reset saved stats</button></div>`;
    document.getElementById('resetStats').addEventListener('click',()=>{
      if(confirm('Reset all WDWQuest stats stored in this browser?')){
        stats=structuredClone(defaults);saveStats();renderStats();
      }
    });
  }

  function render(view){
    if(view==='trivia') return renderTrivia();
    if(view==='where') return renderWhere();
    if(view==='jeopardy') return renderJeopardy();
    if(view==='stats') return renderStats();
    app.innerHTML=home();
  }

  render((location.hash||'#home').slice(1));
})();

</script>
</body>
</html>
