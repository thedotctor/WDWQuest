<style>
:root{--bg:#07111f;--panel:#111c31;--panel2:#17243d;--panel3:#0c1729;--text:#f7f8fc;--muted:#aeb9cf;--border:#2b3b5a;--accent:#7dd3fc;--accent2:#c4b5fd;--good:#86efac;--bad:#fca5a5;--gold:#fde68a;--shadow:0 18px 50px rgba(0,0,0,.23)}
*{box-sizing:border-box}html{color-scheme:dark}body{margin:0;font-family:Inter,ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;background:radial-gradient(circle at 10% -10%,rgba(125,211,252,.13),transparent 30%),radial-gradient(circle at 90% 0%,rgba(196,181,253,.12),transparent 27%),var(--bg);color:var(--text);min-height:100vh}
button,input,select{font:inherit}button{cursor:pointer}button:disabled{cursor:default;opacity:.48}
.site-header{position:sticky;top:0;z-index:20;display:flex;justify-content:space-between;gap:14px;align-items:center;padding:12px 18px;background:rgba(7,17,31,.94);backdrop-filter:blur(14px);border-bottom:1px solid var(--border)}
.brand{display:flex;align-items:center;gap:8px;background:none;border:0;color:var(--text);font-weight:950;font-size:20px}.brand small{font-size:11px;color:var(--accent);border:1px solid var(--border);padding:3px 6px;border-radius:999px}
nav{display:flex;gap:6px;flex-wrap:wrap}nav button{background:transparent;color:var(--muted);border:1px solid transparent;padding:8px 10px;border-radius:10px}nav button:hover{color:var(--text);border-color:var(--border)}
.page-shell{max-width:1160px;margin:0 auto;padding:28px 18px 50px}.hero{padding:32px 0 12px}.eyebrow{font-size:12px;text-transform:uppercase;letter-spacing:.14em;color:var(--accent);font-weight:900}h1{font-size:clamp(42px,8vw,78px);line-height:.94;margin:8px 0 12px}h2{font-size:clamp(27px,4vw,42px);margin:0 0 8px}h3{margin:0 0 8px}.lead{max-width:800px;color:var(--muted);font-size:clamp(17px,2.4vw,21px);line-height:1.55}
.arcade-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:15px;margin-top:24px}.game-card{background:linear-gradient(180deg,rgba(23,36,61,.98),rgba(17,28,49,.98));border:1px solid var(--border);border-radius:20px;padding:20px;box-shadow:var(--shadow);min-height:226px;display:flex;flex-direction:column;position:relative;overflow:hidden}.game-card .icon{font-size:34px;margin-bottom:14px}.game-card p{color:var(--muted);line-height:1.5;flex:1}
.card,.panel{background:var(--panel);border:1px solid var(--border);border-radius:20px;padding:20px;box-shadow:var(--shadow)}.primary,.secondary,.answer-btn,.jcell{border:1px solid var(--border);border-radius:12px;padding:11px 14px;font-weight:800}.primary{background:var(--accent);color:#082137;border-color:transparent}.secondary{background:var(--panel2);color:var(--text)}.danger{background:#472331;color:#fff;border:1px solid #704152;border-radius:12px;padding:11px 14px;font-weight:800}
.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:15px}.stats-row{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin:20px 0}.stat{background:var(--panel);border:1px solid var(--border);border-radius:16px;padding:16px}.stat .n{font-size:28px;font-weight:900}.stat .label{color:var(--muted);font-size:13px}
.filters{display:flex;gap:10px;flex-wrap:wrap;margin:0 0 18px}select,input{background:#0b1527;color:var(--text);border:1px solid var(--border);border-radius:11px;padding:11px 12px;min-height:44px}.question{font-size:clamp(24px,3.7vw,38px);line-height:1.25;margin:18px 0}.answers{display:grid;grid-template-columns:1fr 1fr;gap:10px}.answer-btn{background:#14223a;color:var(--text);text-align:left;min-height:58px}.answer-btn.correct{outline:2px solid var(--good);background:#133524}.answer-btn.wrong{outline:2px solid var(--bad);background:#3c2027}
.feedback{min-height:28px;font-weight:800;margin-top:14px}.good{color:var(--good)}.bad{color:var(--bad)}.gold{color:var(--gold)}.muted{color:var(--muted)}.badge{display:inline-block;border:1px solid var(--border);border-radius:999px;padding:6px 10px;color:var(--muted);font-size:13px}
.progress{height:9px;border-radius:999px;background:#0b1527;overflow:hidden;margin:14px 0}.progress>span{display:block;height:100%;background:linear-gradient(90deg,var(--accent),var(--accent2))}.clue-card{font-size:clamp(22px,3.5vw,34px);line-height:1.35;padding:22px;background:#0b1527;border:1px solid var(--border);border-radius:16px;margin:16px 0}
.photo-frame{position:relative;overflow:hidden;border-radius:18px;border:1px solid var(--border);background:#050b14;aspect-ratio:3/2;margin:16px auto 0;max-width:600px;width:100%}.photo-frame img{position:absolute;width:100%;height:100%;object-fit:cover;transition:transform .45s ease,filter .45s ease}.photo-frame[data-stage="0"] img{transform:scale(3.0);filter:brightness(.84)}.photo-frame[data-stage="1"] img{transform:scale(2.05);filter:brightness(.9)}.photo-frame[data-stage="2"] img{transform:scale(1.35);filter:brightness(.96)}.photo-frame[data-stage="3"] img{transform:scale(1);filter:none}.photo-cover-note{position:absolute;left:12px;bottom:12px;background:rgba(5,11,20,.8);border:1px solid var(--border);padding:7px 9px;border-radius:10px;font-size:12px;color:var(--muted)}
.notice{padding:14px 16px;border:1px dashed var(--border);border-radius:14px;background:#0b1527;color:var(--muted);line-height:1.5;margin:14px 0}.photo-credit{font-size:12px;color:var(--muted);line-height:1.45;margin-top:9px}.photo-credit a{color:var(--accent);text-decoration:none}.photo-credit a:hover{text-decoration:underline}.scorebar{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;align-items:center}
.history-wrap{display:grid;grid-template-columns:1fr 1fr;gap:16px}.history-card{background:var(--panel);border:1px solid var(--border);border-radius:18px;padding:18px}.history-current{font-size:24px;font-weight:900;margin:10px 0}
.jwrap{overflow-x:auto}.jboard{min-width:850px;display:grid;grid-template-columns:repeat(5,1fr);gap:8px}.jhead{background:#152749;border:1px solid var(--border);padding:14px 10px;border-radius:10px;text-align:center;font-weight:900;min-height:74px;display:flex;align-items:center;justify-content:center}.jcell{background:#193768;color:var(--gold);font-size:24px;min-height:88px}.jcell.used{opacity:.2}
.list{display:grid;gap:8px;margin-top:12px}.row{display:flex;justify-content:space-between;gap:12px;border-bottom:1px solid var(--border);padding:9px 0}footer{text-align:center;color:#7f8ba6;font-size:12px;padding:0 18px 26px}
@media(max-width:850px){.arcade-grid{grid-template-columns:1fr 1fr}.answers{grid-template-columns:1fr}.history-wrap{grid-template-columns:1fr}.site-header{align-items:flex-start;flex-direction:column}nav{width:100%;overflow:auto;flex-wrap:nowrap}}
@media(max-width:560px){.photo-frame{max-width:none}.arcade-grid,.stats-row{grid-template-columns:1fr}.page-shell{padding-left:12px;padding-right:12px}}
.photo-error{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;text-align:center;padding:24px;background:#0b1527;color:var(--bad);font-weight:800}.photo-error[hidden]{display:none}</style>

const defaultStats={totalAnswered:0,correct:0,bestStreak:0,streak:0,totalScore:0,gamesPlayed:{},byPark:{},achievements:[]};

function clone(x){return JSON.parse(JSON.stringify(x));}
function loadStats(){try{return Object.assign(clone(defaultStats),JSON.parse(localStorage.getItem('wdwquest_stats_v02')||'null')||{})}catch(e){return clone(defaultStats)}}
function saveStats(){localStorage.setItem('wdwquest_stats_v02',JSON.stringify(stats));}
function esc(s){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));}
function shuffle(a){const b=[...a];for(let i=b.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[b[i],b[j]]=[b[j],b[i]]}return b;}
function pct(){return stats.totalAnswered?Math.round(stats.correct/stats.totalAnswered*100):0;}
function record(park,ok,points=0){stats.totalAnswered++;if(ok){stats.correct++;stats.streak++;stats.bestStreak=Math.max(stats.bestStreak,stats.streak)}else stats.streak=0;stats.totalScore+=points;if(park){stats.byPark[park]||={answered:0,correct:0};stats.byPark[park].answered++;if(ok)stats.byPark[park].correct++;}unlocks();saveStats();}
function unlocks(){const add=a=>{if(!stats.achievements.includes(a))stats.achievements.push(a)};if(stats.correct>=10)add('🏰 Rope Drop Rookie');if(stats.correct>=25)add('🎢 Park Hopper');if(stats.bestStreak>=10)add('🔥 Ten in a Row');if(stats.totalAnswered>=100)add('🧠 Disney Brain');if((stats.gamesPlayed.photo||0)>=5)add('📸 Eagle Eye');}
function bumpGame(name){stats.gamesPlayed[name]=(stats.gamesPlayed[name]||0)+1;saveStats();}
function nav(v){history.replaceState(null,'','#'+v);render(v);window.scrollTo({top:0,behavior:'smooth'});}
document.addEventListener('click',e=>{const b=e.target.closest('[data-nav]');if(b)nav(b.dataset.nav);});

function photoGame(){
app.innerHTML=`<div class="scorebar"><div><div class="eyebrow">New in v0.2</div><h2>Where Am I? Photo</h2></div><span class="badge">100 → 75 → 50 → 25 points</span></div>
<div class="notice"><b>Photo Pack 1:</b> 100 reusable WDW photographs credited to Eden, Janine and Jim under CC BY 2.0 via Wikimedia Commons. Each round includes a source/license credit below the image. <b>Note:</b> remote photos may be blocked by ChatGPT's built-in HTML preview; test Photo Mode on the published GitHub Pages site.</div>
<div class="filters"><select id="pp"><option>All</option><option>Magic Kingdom</option><option>EPCOT</option><option>Hollywood Studios</option><option>Animal Kingdom</option><option>Resorts</option><option>Transportation</option></select></div>
<section class="panel">
<div class="scorebar"><span class="badge" id="pm"></span><span class="badge" id="ps">Reveal 1 of 4</span></div>
<div class="photo-frame" id="pf" data-stage="0"><img id="pi" alt="Walt Disney World photo puzzle"><div class="photo-cover-note">Zoomed photo • reveal more if needed</div></div>
<div class="photo-credit" id="pcredit"></div>
<div class="answers" id="pa" style="margin-top:16px"></div><div class="feedback" id="pfeed"></div>
<div class="actions"><button id="preveal" class="secondary">Zoom out / Reveal more</button><button id="pnext" class="primary">Next Photo</button></div>
</section>`;
let current=null,stage=0,answered=false,wrong=0;
let deck=[];
function refillDeck(){const park=pp.value;deck=shuffle(DATA.photos.filter(x=>park==='All'||x.park===park));}
function next(){
if(!deck.length)refillDeck();
if(!deck.length){pfeed.innerHTML='<span class="bad">No photos in that filter yet.</span>';pa.innerHTML='';return;}
current=deck.pop();stage=0;answered=false;wrong=0;pf.dataset.stage='0';
pi.alt='WDW photo puzzle';
let triedFallback=false;
pi.onerror=()=>{
  if(!triedFallback && current.fallbackSrc){
    triedFallback=true;
    pi.src=current.fallbackSrc;
    return;
  }
  pfeed.innerHTML='<span class="bad">This photo could not load in this browser.</span><br><span class="muted">If you are viewing this file inside ChatGPT, try it on the published GitHub Pages site instead.</span>';
};
pi.onload=()=>{ if(pfeed.textContent.includes('could not load')) pfeed.textContent=''; };
pi.src=current.src;
pm.textContent=`${current.park} • ${deck.length} left in deck`;
ps.textContent='Reveal 1 of 4';pfeed.textContent='';preveal.disabled=false;
pcredit.innerHTML=`Photo: <a href="${current.source}" target="_blank" rel="noopener">${esc(current.credit)}</a> • <a href="${current.licenseUrl}" target="_blank" rel="noopener">${esc(current.license)}</a>`;
renderChoices();
}
function renderChoices(){const unique=[];for(const x of shuffle(DATA.photos)){if(x.answer!==current.answer&&!unique.includes(x.answer))unique.push(x.answer);if(unique.length===3)break;}const opts=shuffle([current.answer,...unique]);pa.innerHTML='';opts.forEach(c=>{const b=document.createElement('button');b.className='answer-btn';b.textContent=c;b.addEventListener('click',()=>{if(answered)return;if(c===current.answer){answered=true;const pts=[100,75,50,25][stage];record(current.park,true,pts);document.querySelectorAll('#pa button').forEach(x=>{x.disabled=true;if(x.textContent===current.answer)x.classList.add('correct')});pf.dataset.stage='3';ps.textContent='Full image';pfeed.innerHTML=`<span class="good">Correct! +${pts}</span> • ${esc(current.area)}<br><span class="muted">${esc(current.note)}</span>`;preveal.disabled=true;}else{wrong++;record(current.park,false,0);b.classList.add('wrong');b.disabled=true;pfeed.innerHTML='<span class="bad">Not quite.</span> You can guess again or reveal more.';}});pa.appendChild(b);});}
preveal.addEventListener('click',()=>{if(answered)return;if(stage<3){stage++;pf.dataset.stage=String(stage);ps.textContent=`Reveal ${stage+1} of 4`;if(stage===3)preveal.disabled=true;}});
pnext.addEventListener('click',next);pp.addEventListener('change',()=>{deck=[];next();});bumpGame('photo');next();
}

function clueGame(){
app.innerHTML=`<div class="scorebar"><div><div class="eyebrow">Classic mode</div><h2>Where Am I? Clues</h2></div><span class="badge">100 / 70 / 40</span></div>
<div class="filters"><select id="cp"><option>All</option><option>Magic Kingdom</option><option>EPCOT</option><option>Hollywood Studios</option><option>Animal Kingdom</option><option>Resorts</option><option>Disney Springs</option></select></div>
<section class="panel"><div class="badge" id="cm"></div><div class="progress"><span id="cprog" style="width:33%"></span></div><div class="clue-card" id="cclue"></div><div class="answers" id="ca"></div><div class="feedback" id="cf"></div><div class="actions"><button id="cmore" class="secondary">Another clue</button><button id="cnext" class="primary">Next location</button></div></section>`;
let current=null,idx=0,answered=false;
function next(){const park=cp.value,pool=DATA.whereClues.filter(x=>park==='All'||x.park===park);current=pool[Math.floor(Math.random()*pool.length)];idx=0;answered=false;cm.textContent=`${current.park} • ${current.diff}`;cf.textContent='';renderClue();renderChoices();}
function renderClue(){cclue.textContent=current.clues[idx];cprog.style.width=`${(idx+1)*33.33}%`;cmore.disabled=idx>=2||answered;}
function renderChoices(){let pool=shuffle(DATA.whereClues.filter(x=>x.a!==current.a));let opts=shuffle([current.a,...pool.slice(0,3).map(x=>x.a)]);ca.innerHTML='';opts.forEach(c=>{const b=document.createElement('button');b.className='answer-btn';b.textContent=c;b.addEventListener('click',()=>{if(answered)return;answered=true;const ok=c===current.a,pts=ok?[100,70,40][idx]:0;record(current.park,ok,pts);document.querySelectorAll('#ca button').forEach(x=>{x.disabled=true;if(x.textContent===current.a)x.classList.add('correct')});if(!ok)b.classList.add('wrong');cf.innerHTML=ok?`<span class="good">Correct! +${pts}</span> • ${esc(current.area)}`:`<span class="bad">Not quite.</span> ${esc(current.a)}`;cmore.disabled=true;});ca.appendChild(b);});}
cmore.addEventListener('click',()=>{if(!answered&&idx<2){idx++;renderClue()}});cnext.addEventListener('click',next);cp.addEventListener('change',next);bumpGame('clues');next();
}

function jeopardy(){
const cats=Object.keys(DATA.jeopardy);
app.innerHTML=`<div class="scorebar"><div><div class="eyebrow">Game</div><h2>WDW Jeopardy</h2></div><div class="stat"><div class="n" id="js">$0</div><div class="label">Board score</div></div></div><section class="panel jwrap"><div class="jboard" id="jb"></div></section><section class="card" id="jc" style="margin-top:16px"><span class="muted">Choose a dollar value to begin.</span></section>`;
let score=0,used=new Set;cats.forEach(c=>{const h=document.createElement('div');h.className='jhead';h.textContent=c;jb.appendChild(h)});for(let row=0;row<5;row++)cats.forEach(c=>{const item=DATA.jeopardy[c][row],key=c+row,b=document.createElement('button');b.className='jcell';b.textContent='$'+item.v;b.addEventListener('click',()=>{if(used.has(key))return;jc.innerHTML=`<div class="badge">${esc(c)} • $${item.v}</div><div class="question">${esc(item.clue)}</div><input id="ji" placeholder="Type your answer"><div class="actions"><button id="jsub" class="primary">Submit</button><button id="jrev" class="secondary">Reveal</button></div><div id="jf" class="feedback"></div>`;function finish(ok){used.add(key);b.classList.add('used');b.disabled=true;if(ok){score+=item.v;record(c,true,item.v)}else{score=Math.max(0,score-item.v);record(c,false,0)}js.textContent='$'+score;}jsub.addEventListener('click',()=>{if(used.has(key))return;const g=ji.value.trim().toLowerCase(),a=item.a.toLowerCase(),ok=g.length>2&&(a.includes(g)||g.includes(a));finish(ok);jf.innerHTML=ok?'<span class="good">Correct!</span>':`<span class="bad">Not quite.</span> Answer: ${esc(item.a)}`;jsub.disabled=jrev.disabled=true;});jrev.addEventListener('click',()=>{if(used.has(key))return;finish(false);jf.innerHTML=`Answer: <span class="gold">${esc(item.a)}</span>`;jsub.disabled=jrev.disabled=true;});});jb.appendChild(b);});bumpGame('jeopardy');
}
